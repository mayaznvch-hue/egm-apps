<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EGM · CRM продаж и обзвона</title>
<style>
:root{--or:#F07A1A;--or2:#fff1e4;--g:#1F2329;--g2:#5b636d;--line:#e5e8ec;--bg:#f5f6f8;--ok:#1e9e5a;--bad:#d93a3a;--warn:#e6a100;--blue:#2f7fd1}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--g);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
select,input,textarea{color:var(--g)}
.who select{background:#fff;color:var(--g);font-weight:600}
.qi .meta{overflow-wrap:anywhere}
header{background:var(--g);color:#fff;position:sticky;top:0;z-index:20}
.hw{max-width:1400px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:18px}.logo b{color:var(--or)}
.badge{font-size:11px;background:var(--or);color:#fff;border-radius:10px;padding:2px 8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.sp{flex:1}
.who{font-size:13px;color:#cfd4da}
nav{max-width:1400px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:8px 10px 0;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;color:#cfd4da;padding:9px 14px;border-radius:9px 9px 0 0;font-weight:600;cursor:pointer;white-space:nowrap;font-size:14.5px}
nav button.on{background:var(--bg);color:var(--g)}
nav button i{font-style:normal;background:var(--or);color:#fff;border-radius:9px;padding:0 7px;font-size:12px;margin-left:5px}
main{max-width:1400px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{margin:0 0 12px;font-size:16px}
.card h3{margin:14px 0 6px;font-size:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;font-weight:600;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--or);color:var(--or)}
.btn.pr{background:var(--or);border-color:var(--or);color:#fff}.btn.pr:hover{background:#d96a0f;color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.dg:hover{border-color:var(--bad);color:var(--bad)}
a.btn{text-decoration:none;display:inline-block;color:var(--g)}
a.btn.pr{color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:5px 13px;cursor:pointer;font-weight:600;font-size:13.5px}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{border:1px solid #d3d8de;border-radius:9px;padding:8px 10px;background:#fff;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--or2);border-color:var(--or)}
.st{display:inline-block;font-size:12px;padding:2px 9px;border-radius:10px;font-weight:700;white-space:nowrap;background:#eef0f3;color:var(--g2)}
.st.new{background:#e8f0fb;color:var(--blue)}.st.noans{background:#eef0f3;color:var(--g2)}.st.callback{background:#ffefbf;color:#8a5f00}
.st.interest{background:#ffe3c9;color:#a34c05}.st.kp{background:#efe6fb;color:#7a4cc2}.st.deal{background:#e3f5ea;color:var(--ok)}.st.refuse{background:#fde8e8;color:var(--bad)}.st.stop{background:#1F2329;color:#fff}
.due{font-size:12.5px;font-weight:600;color:var(--g2);white-space:nowrap}.due.late{color:var(--bad)}.due.today{color:#b85a0a}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.sum div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.sum b{display:block;font-size:22px}.sum span{color:var(--g2);font-size:12.5px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.q{display:grid;gap:10px}
.qi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;cursor:pointer;border-left:4px solid var(--line)}
.qi:hover{border-color:var(--or);border-left-color:var(--or)}
.qi.late{border-left-color:var(--bad)}.qi.hot{border-left-color:var(--or)}
.qi .nm{font-weight:700;overflow-wrap:anywhere}
.qi .meta{color:var(--g2);font-size:13px}
.qi .why{grid-column:1/-1;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qi .r{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.list{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(210px,2.2fr) minmax(150px,1.5fr) minmax(90px,1fr) 150px 130px 110px 100px 90px;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid #f0f2f4;font-size:13.5px}
.row>*{min-width:0;overflow-wrap:anywhere}
.row.hd{background:#fafbfc;color:var(--g2);font-weight:700;font-size:12px;position:sticky;top:0}
.row small{display:block;color:var(--g2)}
.row.me{cursor:pointer}.row.me:hover{background:#fffaf5}
.fil{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.fil input[type=search]{flex:1;min-width:180px}
.fb{display:grid;gap:10px}
.funnel .fr{display:grid;grid-template-columns:150px 1fr 120px;gap:10px;align-items:center;padding:6px 0}
.funnel .tr{background:#eef0f3;border-radius:8px;height:30px;overflow:hidden;position:relative}
.funnel .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--or),#f5a15d);border-radius:8px;min-width:4px;transition:width .4s}
.funnel .tr b{position:absolute;left:10px;top:5px;font-size:14px;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.4)}
.funnel .cv{font-size:13px;color:var(--g2);text-align:right}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pb{background:#eef0f3;border-radius:6px;height:12px;overflow:hidden;margin:3px 0 8px}.pb i{display:block;height:100%;background:var(--ok)}
.pb i.mid{background:var(--warn)}.pb i.low{background:var(--bad)}
.pl{display:flex;justify-content:space-between;font-size:13.5px}
.pl span{color:var(--g2)}
.pi{width:86px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--g2);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid #f0f2f4}
.scroll{overflow-x:auto}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:10px;font-weight:700;white-space:nowrap}
.tag.cl{background:#e3f5ea;color:var(--ok)}.tag.cp{background:#fde8e8;color:var(--bad)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(31,35,41,.55);z-index:40;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px}
.ov.on{display:flex}
.sheet{background:var(--bg);border-radius:16px;width:100%;max-width:1100px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px 18px;background:#fff;border-radius:16px 16px 0 0;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;flex-wrap:wrap}
.sh-h h2{margin:0;font-size:18px;flex:1;min-width:200px;overflow-wrap:anywhere}
.x{border:0;background:#eef0f3;border-radius:50%;width:34px;height:34px;font-size:20px;cursor:pointer}
.sh-b{padding:16px;display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.sh-b.one{grid-template-columns:1fr;max-width:640px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14px}
.kv dt{color:var(--g2)}.kv dd{margin:0;overflow-wrap:anywhere}
.phone{font-size:20px;font-weight:700;color:var(--g);text-decoration:none;white-space:nowrap}
.warn{background:#1F2329;color:#fff;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.step{border-left:3px solid var(--or);padding:4px 0 4px 12px;margin:10px 0;font-size:14.5px}
.step small{display:block;color:var(--or);font-weight:700;text-transform:uppercase;font-size:11.5px;letter-spacing:.4px}
details{background:#fff;border:1px solid var(--line);border-radius:10px;margin:6px 0}
summary{padding:10px 12px;cursor:pointer;font-weight:700;font-size:14px}
details div{padding:0 12px 12px;font-size:14px}
.res{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.res button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 8px;font-weight:700;cursor:pointer;font-size:14px}
.res button:hover{border-color:var(--or)}
.res .noans{border-left:4px solid #9aa3ad}.res .callback{border-left:4px solid var(--warn)}.res .interest{border-left:4px solid var(--or)}
.res .kp{border-left:4px solid #8e6ccf}.res .deal{border-left:4px solid var(--ok)}.res .refuse{border-left:4px solid var(--bad)}
.hist{font-size:13px;color:var(--g2);display:grid;gap:4px}
.hist b{color:var(--g)}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calc select{grid-column:1/-1}
.calc label{font-size:12.5px;color:var(--g2);display:block}
.calc input{width:100%}
.calc .tot{grid-column:1/-1;background:var(--or2);border-radius:10px;padding:10px 12px;font-size:14px}
.calc .tot b{font-size:19px}
.frm{display:grid;gap:10px}.frm label{font-size:13px;color:var(--g2);display:grid;gap:3px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.3s;z-index:60;font-size:14px;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.note{color:var(--g2);font-size:13px}
.empty{padding:30px;text-align:center;color:var(--g2)}
@media(max-width:900px){.sh-b{grid-template-columns:1fr}.g2,.g3{grid-template-columns:1fr}}
@media(max-width:760px){
 .row{grid-template-columns:1fr auto;gap:4px 10px;padding:12px}.row.hd{display:none}
 .row>*{grid-column:1/-1}.row .c-nm{grid-column:1}.row .c-st{grid-column:2;grid-row:1;justify-self:end}
 .row .c-go{grid-column:1/-1}
 .row .c-ok,.row .c-di,.row .c-mg{display:inline}
 .funnel .fr{grid-template-columns:1fr;gap:4px}.funnel .cv{text-align:left}
 main{padding:10px}.card{padding:12px}.ov{padding:0}.sheet{border-radius:0;min-height:100%}.sh-h{border-radius:0;padding:10px 12px}
 .kv{grid-template-columns:90px 1fr}
 .hw{padding:8px 12px 0}.logo{font-size:16px}
}
</style>
</head>
<body>
<header>
 <div class="hw"><div class="logo"><b>EGM</b> · CRM продаж и обзвона</div><span class="badge">демо</span><div class="sp"></div>
  <div class="who">Менеджер: <select id="me"></select></div></div>
 <nav id="nav"></nav>
</header>
<main id="main"></main>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>

 '81.30':{w:'благоустройство территорий',why:'Делает тротуары, парковки, газоны: нужны песок, щебень 5–20 и грунт.',off:'Песок, щебень 5–20, плодородный грунт. Можно по одному рейсу.'},
 '23.63':{w:'производство бетона (РБУ)',why:'Бетонный узел: стабильно закупает щебень 5–20 и песок.',off:'Щебень гранитный 5–20 и песок по графику, фиксированная цена на месяц.'},

 '68.32':{w:'управление домами и территориями',why:'Управляет домами и территориями: зимой нужен вывоз снега, летом — песок и щебень.',off:'Вывоз снега самосвалами, договор на сезон, акты и УПД.'}
};
var OKL=Object.keys(OK);

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function iso(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd}
function addD(n,from){var d=from?new Date(from+'T12:00:00'):new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return iso(d)}
var TODAY=iso(new Date());

function dueTag(c){if(!c.next)return '<span class="due">нет даты</span>';var n=diffD(c.next);

function rng(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;var t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function toast(t){var e=$('toast');e.textContent=t;e.className='toast on';clearTimeout(toast.t);toast.t=setTimeout(function(){e.className='toast'},2400)}

var NOTES={interest:['Просит цены на щебень 20–40 с доставкой','Интересно по ПГС, ждёт расчёт','Нужен вывоз грунта с объекта, уточняет объём'],kp:['КП ушло на почту, ждём ответ','Отправили расчёт в мессенджер'],deal:['Заказал первый рейс 20 т','Заключаем договор поставки'],refuse:['Работают со своим карьером','Не нужно, закрыли объект'],callback:['Просил позвонить после планёрки','Директор на объекте, перезвонить'],noans:['Не берут трубку','Занято']};
function fp(r){var m=r()<0.62;function d(n){var s='';for(var i=0;i<n;i++)s+=Math.floor(r()*10);return s}
 if(m)return '+7 (9'+(['03','16','25','26','39','85'][Math.floor(r()*6)])+') '+d(3)+'-'+d(2)+'-'+d(2);
 return '+7 ('+['495','496','498'][Math.floor(r()*3)]+') '+(2+Math.floor(r()*7))+d(2)+'-'+d(2)+'-'+d(2)}
function seedAll(){
 var r=rng(777),C=[],used={},dk=Object.keys(DISTR),i;

 var matOpt=MAT.map(function(m,i){return '<option value="'+i+'">'+m[0]+' — '+fmt(m[1])+' ₽/т</option>'}).join('');
 var hist=c.hist.length?c.hist.map(function(h){return '<div><b>'+fd(h.d)+'</b> · '+esc(h.m)+' · <span class="st '+h.res+'">'+RESL[h.res]+'</span> '+esc(h.txt||'')+'</div>'}).join(''):'<div>Звонков ещё не было.</div>';
 var left=(sh?'<div class="warn">⛔ Стоп-лист: '+esc(sh.note)+'. Звонить не нужно.</div>':'')+
  '<div class="card"><dl class="kv"><dt>Телефон</dt><dd><a class="phone" href="tel:'+esc(c.phone.replace(/[^+\d]/g,''))+'">'+esc(c.phone)+'</a></dd><dt>Контакт</dt><dd>'+esc(c.lpr)+'</dd><dt>ИНН</dt><dd>'+esc(c.inn)+'</dd><dt>ОКВЭД</dt><dd>'+c.okved+' · '+esc(c.work)+'</dd><dt>Район</dt><dd>'+esc(c.district)+' (около '+km+' км от склада)</dd><dt>Менеджер</dt><dd>'+esc(c.m)+'</dd></dl>'+
  '<h3>Почему наш клиент</h3><div>'+esc(c.why)+'</div><h3>Что предложить</h3><div><b>'+esc(c.off)+'</b></div></div>'+
  '<div class="card" style="margin-top:12px"><h2>Скрипт разговора</h2>'+script+'</div>'+
  '<div class="card" style="margin-top:12px"><h2>Если говорят…</h2>'+obj.map(function(o){return '<details><summary>'+o[0]+'</summary><div>'+o[1]+'</div></details>'}).join('')+'</div>';
 var right='<div class="card"><h2>Результат звонка</h2><div class="res">'+RES.map(function(r){return '<button class="'+r+'" data-res="'+r+'">'+RESL[r]+'</button>'}).join('')+'</div>'+
  '<h3>Дата следующего касания</h3><div class="fil" style="margin-bottom:6px"><input type="date" id="nxDate" value="'+def+'" min="'+TODAY+'"><button class="chip" data-nx="1">завтра</button><button class="chip" data-nx="3">через 3 дня</button><button class="chip" data-nx="7">через неделю</button></div>'+
  '<div class="note" id="nxHint">Если не менять: «не дозвонился» — завтра, «интерес» — через 2 дня, «КП» — через 3 дня. «Сделка» и «отказ» закрывают задачу.</div>'+
  '<h3>Заметка</h3><textarea id="cmt" rows="2" placeholder="Что сказал клиент"></textarea>'+
  '<div class="fil" style="margin:10px 0 0"><button class="btn" data-skip="1">Пропустить, следующий →</button></div></div>'+
  '<div class="card" style="margin-top:12px"><h2>Сколько с доставкой</h2><div class="calc"><select id="cMat">'+matOpt+'</select><div><label>Тонн</label><input type="number" id="cT" min="1" value="20"></div><div><label>Расстояние, км</label><input type="number" id="cK" min="1" value="'+km+'"></div><div class="tot" id="cOut"></div><button class="btn" data-kp="1">Скопировать КП</button><button class="btn" data-kpc="1">В заметку</button></div><p class="note">Расчёт ориентировочный: цена материала + доставка рейсами по 20 т (1 500 ₽ + 70 ₽ за км).</p></div>'+
  '<div class="card" style="margin-top:12px"><h2>История</h2><div class="hist">'+hist+'</div></div>';
 $('sheet').innerHTML='<div class="sh-h"><h2>'+esc(c.name)+'</h2><span class="st '+c.st+'">'+ST[c.st]+'</span><button class="x" data-close="1" aria-label="Закрыть">×</button></div><div class="sh-b"><div>'+left+'</div><div>'+right+'</div></div>';
 $('ov').className='ov on';document.body.style.overflow='hidden';$('ov').scrollTop=0;calc();
}
function calcVals(){var m=MAT[+$('cMat').value],t=Math.max(1,+$('cT').value||1),k=Math.max(1,+$('cK').value||1),tr=Math.ceil(t/20),mat=t*m[1],del=tr*(1500+70*k),tot=mat+del;return{m:m,t:t,k:k,tr:tr,mat:mat,del:del,tot:tot}}
function calc(){if(!$('cMat'))return;var v=calcVals();$('cOut').innerHTML='Итого: <b>'+fmt(v.tot)+' ₽</b> ('+fmt(v.tot/v.t)+' ₽/т с доставкой)<br><span class="note">Материал '+fmt(v.mat)+' ₽ + доставка '+fmt(v.del)+' ₽ ('+v.tr+' '+(v.tr===1?'рейс':v.tr<5?'рейса':'рейсов')+')</span>'}
function kpText(){var c=byId(U.open),v=calcVals();return 'Коммерческое предложение — ЕГМ\nКомпания: '+c.name+'\n'+v.m[0]+', '+v.t+' т, доставка '+c.district+' (~'+v.k+' км)\nМатериал: '+fmt(v.mat)+' ₽ ('+fmt(v.m[1])+' ₽/т)\nДоставка: '+fmt(v.del)+' ₽, рейсов по 20 т: '+v.tr+'\nИтого с доставкой: '+fmt(v.tot)+' ₽ ('+fmt(v.tot/v.t)+' ₽/т)\nМашина — в день заявки. Цены ориентировочные, действуют 3 дня.'}
function copy(t,msg){function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast(msg)}catch(e){toast('Не удалось скопировать')}document.body.removeChild(a)}
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast(msg)},fb);else fb()}
function closeCard(){document.body.style.overflow='';$('ov').className='ov';$('sheet').innerHTML='';U.open=null;U.snap=[]}
function nextAfter(id){var q=queue().filter(function(x){return x.id!==id});
 var i=U.snap.indexOf(id),nx=null,k;
 for(k=i+1;k<U.snap.length;k++){var cand=q.filter(function(x){return x.id===U.snap[k]})[0];if(cand){nx=cand;break}}
 if(!nx&&q.length)nx=q[0];return nx}
function setRes(res){
 var c=byId(U.open);if(!c)return;
 var date=$('nxDate').value,txt=$('cmt').value.trim();
 var nx=(res==='deal'||res==='refuse')?null:(U.dirty&&date?date:addD(DEFD[res]||1));
 if(res==='callback'&&!U.dirty)nx=date||addD(1);
 if(nx&&nx<TODAY)nx=TODAY;
 c.st=res;c.next=nx;
 var t=new Date();c.hist.unshift({d:TODAY,res:res,m:c.m,txt:txt});
 S.log.push({d:TODAY,m:c.m,res:res,id:c.id,t:t.getHours()+':'+('0'+t.getMinutes()).slice(-2)});
 save();
 var nxt=nextAfter(c.id);
 toast(RESL[res]+(nx?' · следующее касание '+fd(nx):' · задача закрыта'));
 if(nxt){openCard(nxt.id)}else{closeCard();toast('Очередь пройдена. '+RESL[res]+'.')}
 renderNav();if(U.tab!=='queue'||true)render();
}

/* ---------- CSV ---------- */
function csvCell(v){v=String(v==null?'':v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
var COLS=['Название','ИНН','ОКВЭД','Вид работ','Район','Телефон','ЛПР','Статус','След. касание','Менеджер','Почему наш клиент','Что предложить'];
function rowOf(c){return [c.name,c.inn,c.okved,c.work,c.district,c.phone,c.lpr,ST[c.st],c.next||'',c.m,c.why,c.off]}
function download(name,text){var b=new Blob(['\uFEFF'+text],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href)},500)}
function exportCsv(kind){
 var rows;if(kind==='tpl')rows=[COLS.slice(0,7),['ООО «Пример-Строй»','5001234567','43.12','земляные работы','Химки','+7 (495) 123-45-67','Иванов Сергей Петрович']];
 else{var list=kind==='queue'?queue():S.C;rows=[COLS].concat(list.map(rowOf))}
 var text=rows.map(function(r){return r.map(csvCell).join(';')}).join('\r\n');
 download(kind==='tpl'?'egm_shablon.csv':kind==='queue'?'egm_ochered_'+TODAY+'.csv':'egm_baza_'+TODAY+'.csv',text);
 toast('Файл сформирован: '+(rows.length-1)+' строк');return text}
function parseCsv(t){t=t.replace(/^\uFEFF/,'');var first=t.split(/\r?\n/)[0]||'',d=(first.split(';').length>=first.split(',').length)?';':',';
 var rows=[],row=[],cell='',q=false,i,ch;
 for(i=0;i<t.length;i++){ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
  else if(ch==='"')q=true;else if(ch===d){row.push(cell);cell=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(function(x){return x.trim()}))rows.push(row);row=[]}
  else cell+=ch}
 row.push(cell);if(row.some(function(x){return x.trim()}))rows.push(row);return rows}
function doImport(text){
 var rows=parseCsv(text);if(rows.length<2)return 'Нет данных: нужна строка заголовков и хотя бы одна компания.';
 var hd=rows[0].map(function(x){return x.trim().toLowerCase()}),ix={};
 function find(keys){for(var i=0;i<hd.length;i++)for(var k=0;k<keys.length;k++)if(hd[i].indexOf(keys[k])===0)return i;return -1}
 ix.name=find(['назв','компан']);ix.inn=find(['инн']);ix.ok=find(['оквэд']);ix.w=find(['вид']);ix.di=find(['район','город']);ix.ph=find(['тел']);ix.lpr=find(['лпр','контакт']);ix.why=find(['почему']);ix.off=find(['что пред','предлож']);
 if(ix.name<0)return 'Не нашёл колонку «Название». Проверьте первую строку.';
 var add=0,dup=0,stp=0,bad=0,have={};S.C.forEach(function(c){if(c.inn)have[c.inn]=1});
 var load={};MG.forEach(function(m){load[m]=S.C.filter(function(c){return c.m===m&&c.st==='new'}).length});
 for(var r=1;r<rows.length;r++){var x=rows[r],g=function(k){return ix[k]>=0?(x[ix[k]]||'').trim():''},name=g('name');
  if(!name){bad++;continue}
  var inn=g('inn').replace(/\D/g,''),ok=g('ok'),od=OK[ok];
  if(inn&&have[inn]){dup++;continue}
  var c={id:S.nid++,name:name,inn:inn,okved:ok||'—',work:g('w')||(od?od.w:'строительные работы'),district:g('di')||'Москва',phone:g('ph'),lpr:g('lpr'),why:g('why')||(od?od.why:'Строительная компания: используется щебень, песок и ПГС.'),off:g('off')||(od?od.off:'Щебень, песок, ПГС с доставкой своими самосвалами.'),st:'new',next:TODAY,m:'',hist:[],email:''};
  if(stopHit(c)){stp++;continue}
  var mm=MG.slice().sort(function(a,b){return load[a]-load[b]})[0];c.m=mm;load[mm]++;
  S.C.push(c);if(inn)have[inn]=1;add++}
 save();render();
 return 'Добавлено: '+add+'. Дубли по ИНН: '+dup+'. В стоп-листе: '+stp+(bad?'. Пустых строк: '+bad:'')+'.'}

/* ---------- модальные формы ---------- */
function openAdd(){
 $('sheet').innerHTML='<div class="sh-h"><h2>Новая компания</h2><button class="x" data-close="1">×</button></div><div class="sh-b one"><div class="card frm"><label>Название<input type="text" id="aN" placeholder="ООО «Название»"></label><label>ИНН<input type="text" id="aI" inputmode="numeric"></label><label>Телефон<input type="text" id="aP" placeholder="+7 (___) ___-__-__"></label><label>Контактное лицо<input type="text" id="aL"></label><label>Район<select id="aD">'+Object.keys(DISTR).map(function(d){return '<option>'+d+'</option>'}).join('')+'</select></label><label>Вид работ<select id="aO">'+OKL.map(function(k){return '<option value="'+k+'">'+k+' · '+OK[k].w+'</option>'}).join('')+'</select></label><div class="note" id="aE"></div><button class="btn pr" data-asave="1">Сохранить</button></div></div>';
 $('ov').className='ov on';document.body.style.overflow='hidden'}
function saveAdd(){var n=$('aN').value.trim();if(!n){$('aE').textContent='Укажите название.';return}
 var ok=$('aO').value,o=OK[ok],c={id:S.nid++,name:n,inn:$('aI').value.replace(/\D/g,''),okved:ok,work:o.w,district:$('aD').value,phone:$('aP').value.trim(),lpr:$('aL').value.trim(),why:o.why,off:o.off,st:'new',next:TODAY,m:MG[S.C.length%3],hist:[],email:''};
 if(c.inn&&S.C.some(function(x){return x.inn===c.inn})){$('aE').textContent='Компания с таким ИНН уже есть в базе.';return}
 var sh=stopHit(c);if(sh){$('aE').textContent='В стоп-листе: '+sh.note+'. Не добавлено.';return}
 S.C.push(c);save();closeCard();render();toast('Компания добавлена, она в очереди на сегодня')}

/* ---------- события ---------- */
document.addEventListener('click',function(e){
 var t=e.target,b=t.closest('[data-stop]');if(b)return;
 var el;
 if((el=t.closest('#nav button'))){U.tab=el.dataset.t;render();window.scrollTo(0,0);return}
 if(t===$('ov')){closeCard();return}
 if((el=t.closest('[data-close]'))){closeCard();return}
 if((el=t.closest('[data-res]'))){setRes(el.dataset.res);return}
 if((el=t.closest('[data-nx]'))){$('nxDate').value=addD(+el.dataset.nx);U.dirty=true;return}
 if((el=t.closest('[data-skip]'))){var n=nextAfter(U.open);if(n)openCard(n.id);else{closeCard();toast('Больше задач нет')}return}
 if((el=t.closest('[data-kp]'))){copy(kpText(),'КП скопировано');return}
 if((el=t.closest('[data-kpc]'))){var cm=$('cmt');cm.value=(cm.value?cm.value+'\n':'')+kpText().split('\n').slice(2).join('; ');toast('Расчёт добавлен в заметку');return}
 if((el=t.closest('[data-me]'))){U.me=el.dataset.me;render();return}
 if((el=t.closest('[data-per]'))){U.per=+el.dataset.per;render();return}
 if((el=t.closest('[data-add]'))){openAdd();return}
 if((el=t.closest('[data-asave]'))){saveAdd();return}
 if((el=t.closest('[data-sdel]'))){S.stop=S.stop.filter(function(s){return s.id!==+el.dataset.sdel});save();render();toast('Убрано из стоп-листа');return}
 if((el=t.closest('[data-sadd]'))){var nm=$('sName').value.trim();if(!nm&&!$('sInn').value.trim()&&!$('sPh').value.trim()){toast('Укажите название, ИНН или телефон');return}
  S.stop.push({id:S.sid++,type:$('sType').value,name:nm||'(без названия)',inn:$('sInn').value.replace(/\D/g,''),phone:$('sPh').value.trim(),note:$('sNote').value.trim()||(('client'===$('sType').value)?'Текущий клиент':'Конкурент')});save();render();toast('Добавлено в стоп-лист');return}
 if((el=t.closest('[data-chk]'))){var v=$('chk').value.trim(),res=$('chkR');if(!v){res.textContent='Введите значение.';return}
  var probe={name:v,inn:v.replace(/\D/g,'').length>=10&&v.replace(/\D/g,'').length<=12&&!/^\+|^8/.test(v)?v.replace(/\D/g,''):'',phone:v};var h=stopHit(probe);
  res.innerHTML=h?'⛔ <b>Звонить нельзя:</b> '+esc(h.name)+' — '+esc(h.note):'✅ В стоп-листе не найдено, можно звонить.';return}
 if((el=t.closest('[data-exp]'))){exportCsv(el.dataset.exp);return}
 if((el=t.closest('[data-imp]'))){$('impR').textContent=doImport($('csvT').value);return}
 if((el=t.closest('[data-reset]'))){if(confirm('Вернуть исходные демо-данные? Все ваши изменения пропадут.')){S=seedAll();save();render();toast('Демо-данные восстановлены')}return}
 if((el=t.closest('[data-open]'))){openCard(+el.dataset.open);return}
});
document.addEventListener('input',function(e){var t=e.target;
 if(t.id==='fq'){U.f.q=t.value;var pos=t.selectionStart;render();var n=$('fq');if(n){n.focus();n.setSelectionRange(pos,pos)}}
 if(t.id==='nxDate')U.dirty=true;
 if(t.id==='cMat'||t.id==='cT'||t.id==='cK')calc();
 if(t.dataset&&t.dataset.plan){var v=Math.max(0,+t.value||0);S.plan[t.dataset.plan]=v;save();var act=t.dataset.plan;render();var n2=document.querySelector('[data-plan="'+act+'"]');if(n2){n2.focus();n2.setSelectionRange(n2.value.length,n2.value.length)}}
});
document.addEventListener('change',function(e){var t=e.target;
 if(t.dataset&&t.dataset.f){U.f[t.dataset.f]=t.value;render()}
 if(t.id==='fns'){U.f.nostop=t.checked;render()}
 if(t.id==='me'){U.me=t.value;render()}
 if(t.id==='fileIn'&&t.files[0]){var fr=new FileReader();fr.onload=function(){$('csvT').value=fr.result;$('impR').textContent=doImport(fr.result)};fr.readAsText(t.files[0],'utf-8')}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&U.open!==null||(e.key==='Escape'&&$('ov').className==='ov on'))closeCard()});
window.__egm={S:function(){return S},U:U,queue:queue,exportCsv:exportCsv,doImport:doImport,stopHit:stopHit};
render();
})();
