  C.forEach(function(c){c.invoices=c.inv.map(function(x){x.due=addDays(x.date,c.terms);return x});delete c.inv;

    // раскладываем часть оплат: старые счета закрываем платежами (FIFO), чтобы остаток был правдоподобным

function addDays(iso,n){var d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function diffDays(a,b){return Math.round((Date.parse(a+'T12:00:00Z')-Date.parse(b+'T12:00:00Z'))/864e5)}
function r2(x){return Math.round(x*100)/100}
function fm(v){return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0')}
function fd(iso){var p=iso.split('-');return p[2]+'.'+p[1]+'.'+p[0]}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(s,r){return(r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},2400)}

function cById(id){for(var i=0;i<S.clients.length;i++)if(S.clients[i].id===id)return S.clients[i]}

/* расчёты */
function open(c){return c.invoices.filter(function(i){return r2(i.sum-i.paid)>0}).sort(function(a,b){return a.due<b.due?-1:1})}
function rest(i){return r2(i.sum-i.paid)}
function calc(c){
  var T=S.today,debt=0,over=0,maxDays=0,nextDue=null,week=0;
  open(c).forEach(function(i){var r=rest(i);debt+=r;var d=diffDays(T,i.due);
    if(d>0){over+=r;if(d>maxDays)maxDays=d}else{if(!nextDue||i.due<nextDue)nextDue=i.due}
    if(i.due>=T&&i.due<=addDays(T,7))week+=r});
  debt=r2(debt);over=r2(over);
  var usage=c.limit?debt/c.limit:0,autoStop=debt>c.limit,stop=c.stopManual||autoStop;
  var risk=maxDays>14||usage>1?'r':maxDays>7?'o':(maxDays>0||usage>.8||(nextDue&&diffDays(nextDue,T)<=3))?'y':'g';
  if(debt===0)risk='g';
  var firstDue=open(c).length?open(c)[0].due:null;
  return{debt:debt,over:over,maxDays:maxDays,nextDue:nextDue,firstDue:firstDue,week:r2(week),usage:usage,autoStop:autoStop,stop:stop,risk:risk};
}
var RK={g:'Низкий',y:'Внимание',o:'Высокий',r:'Критичный'};
function stageDate(i,st){return addDays(i.due,st[2])}
function stageStatus(c,i,st){
  var k=c.id+':'+i.no+':'+st[0];if(S.sent[k])return{k:'sent',date:S.sent[k]};
  var d=stageDate(i,st);
  if(d===S.today)return{k:'today',date:d};
  if(d<S.today)return{k:'late',date:d};
  return{k:'wait',date:d};
}
function fill(tpl,c,i){
  var cc=calc(c),dd=Math.max(0,diffDays(S.today,i.due));
  return tpl.replace(/\{клиент\}/g,c.name).replace(/\{контакт\}/g,c.contact).replace(/\{счёт\}/g,i.no).replace(/\{сумма\}/g,fm(rest(i))).replace(/\{срок\}/g,fd(i.due)).replace(/\{дней\}/g,String(dd)).replace(/\{долг\}/g,fm(cc.debt)).replace(/\{менеджер\}/g,c.mgr);
}

function setTpl(ch,st,v){S.tpl=S.tpl||{email:{},sms:{}};S.tpl[ch][st]=v;save()}

/* итоги */
function totals(){
  var debt=0,over=0,week=0,buckets=[0,0,0,0,0],days=[0,0,0,0,0,0,0,0];
  S.clients.forEach(function(c){open(c).forEach(function(i){var r=rest(i),d=diffDays(S.today,i.due);debt+=r;
    if(d>0){over+=r;buckets[d<=7?1:d<=14?2:d<=30?3:4]+=r}else buckets[0]+=r;
    var k=diffDays(i.due,S.today);if(k>=0&&k<=7){week+=r;days[k]+=r}})});
  return{debt:r2(debt),over:r2(over),week:r2(week),buckets:buckets,days:days};
}
function barSvg(vals,labels,colors,w,h,unit){
  var max=Math.max.apply(null,vals.concat([1])),n=vals.length,pl=10,pr=10,pt=24,pb=38,bw=(w-pl-pr)/n,s='<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" style="max-width:'+w+'px;display:block">';
  for(var g=0;g<=3;g++){var y=pt+(h-pt-pb)*(1-g/3);s+='<line x1="'+pl+'" x2="'+(w-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#e3e6ea"/>'}
  vals.forEach(function(v,i){var bh=(h-pt-pb)*v/max,x=pl+i*bw+bw*.15,y=h-pb-bh;
    s+='<rect x="'+x+'" y="'+y+'" width="'+bw*.7+'" height="'+Math.max(bh,v>0?2:0)+'" rx="4" fill="'+colors[i%colors.length]+'"/>';
    s+='<text x="'+(x+bw*.35)+'" y="'+(y-6)+'" font-size="11" text-anchor="middle" fill="#1F2329" font-weight="600">'+(v>0?fm(v/1000)+' т':'')+'</text>';
    s+='<text x="'+(x+bw*.35)+'" y="'+(h-pb+16)+'" font-size="11" text-anchor="middle" fill="#6b7380">'+labels[i][0]+'</text>';
    if(labels[i][1])s+='<text x="'+(x+bw*.35)+'" y="'+(h-pb+30)+'" font-size="10" text-anchor="middle" fill="#9aa1ac">'+labels[i][1]+'</text>';
  });
  return s+'</svg>';
}

/* список */
function renderList(){
  if(sel)return renderCard(cById(sel));

    if(F.risk==='over'&&!(x.k.over>0))return false;

}
function doSend(c,i,stage,ch,auto){
  var st=ST.filter(function(x){return x[0]===stage})[0];
  S.sent[c.id+':'+i.no+':'+stage]=S.today;
  S.log.unshift({ts:S.today+' '+new Date().toTimeString().slice(0,5),cid:c.id,stage:stage,ch:ch,text:(auto?'автоматически: ':'вручную: ')+st[1].toLowerCase()+', счёт № '+i.no+', '+fm(rest(i))+' ₽'});
}

/* стоп-отгрузка */
function renderStop(){
  var rows=S.clients.map(function(c){return{c:c,k:calc(c)}});
  var h='<div class="card"><h3>Проверка новой заявки</h3><div class="mut" style="margin-bottom:8px">Диспетчер вводит клиента и сумму заказа — система говорит, можно ли отгружать.</div><div class="fields"><div><label class="f">Клиент</label><select id="oc">';
  S.clients.forEach(function(c){h+='<option value="'+c.id+'">'+esc(c.name)+'</option>'});
  h+='</select></div><div><label class="f">Материал и количество</label><select id="om"><option value="49000">Щебень гранитный 20-40, 20 т (≈ 49 000 ₽)</option><option value="52500">Щебень 5-20 + доставка (≈ 52 500 ₽)</option><option value="18400">Песок, 20 т (≈ 18 400 ₽)</option><option value="196000">Щебень, 4 рейса (≈ 196 000 ₽)</option></select></div><div style="align-self:end"><button class="btn" id="oBtn">Проверить</button></div></div><div id="oRes"></div></div>';
  h+='<div class="card"><h3>Клиенты и блокировки</h3><div class="tblwrap"><table class="t"><tr><th>Клиент</th><th class="n">Долг</th><th class="n hm">Лимит</th><th>Состояние</th><th></th></tr>';
  rows.sort(function(a,b){return(b.k.stop?1:0)-(a.k.stop?1:0)||b.k.usage-a.k.usage}).forEach(function(x){
    h+='<tr><td><b>'+esc(x.c.name)+'</b></td><td class="n">'+fm(x.k.debt)+'</td><td class="n hm">'+fm(x.c.limit)+'</td><td>'+(x.k.stop?'<span class="stop" style="margin:0">СТОП</span> <span class="mut">'+(x.k.autoStop?'лимит превышен':'вручную')+(x.k.autoStop&&x.c.stopManual?' + вручную':'')+'</span>':'<span class="rk g">Отгрузка идёт</span> <span class="mut">'+Math.round(x.k.usage*100)+'% лимита</span>')+'</td><td><button class="btn sm '+(x.c.stopManual?'sec':'red')+'" data-tg="'+x.c.id+'">'+(x.c.stopManual?'Снять ручной стоп':'Остановить вручную')+'</button></td></tr>'});
  h+='</table></div><div class="mut" style="margin-top:8px">Автоматический стоп включается, когда долг больше лимита, и снимается сам после оплаты. Ручной стоп держится, пока его не снимут.</div></div>';
  $('#main').innerHTML=h;
  $$('[data-tg]').forEach(function(b){b.onclick=function(){var c=cById(+b.dataset.tg);c.stopManual=!c.stopManual;logEvt(c,'Стоп-отгрузка '+(c.stopManual?'включена вручную':'снята'));save();renderStop();toast(c.stopManual?'Отгрузка остановлена':'Ручной стоп снят')}});
  $('#oBtn').onclick=function(){
    var c=cById(+$('#oc').value),sum=+$('#om').value,k=calc(c),after=k.debt+sum,o=$('#oRes');
    if(k.stop)o.innerHTML='<div class="alert bad">ОТГРУЗКА ЗАПРЕЩЕНА. '+(k.autoStop?'Долг '+fm(k.debt)+' ₽ уже больше лимита '+fm(c.limit)+' ₽.':'Включён ручной стоп.')+' Нужна оплата'+(k.autoStop?' не менее '+fm(k.debt-c.limit)+' ₽':'')+' или решение руководителя.</div>';
    else if(after>c.limit)o.innerHTML='<div class="alert bad">ОТГРУЗКА ЗАПРЕЩЕНА: с этой заявкой долг станет '+fm(after)+' ₽ при лимите '+fm(c.limit)+' ₽ (превышение '+fm(after-c.limit)+' ₽). Нужна предоплата или согласование.</div>';
    else o.innerHTML='<div class="alert ok">Можно отгружать. Долг после заявки: '+fm(after)+' ₽ из '+fm(c.limit)+' ₽ ('+Math.round(after/c.limit*100)+'%).'+(k.over>0?' Внимание: есть просрочка '+fm(k.over)+' ₽.':'')+'</div>';
  };
}

function setTab(t){tab=t;if(t!=='list'&&t!=='sum')sel=sel;$$('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});render();window.scrollTo(0,0)}
function render(){({sum:renderSum,list:renderList,rem:renderRem,stop:renderStop})[tab]()}
$$('#tabs button').forEach(function(b){b.onclick=function(){if(b.dataset.t==='list')sel=null;setTab(b.dataset.t)}});
$('#today').onchange=function(){if(this.value){S.today=this.value;save();render()}};
$('#reset').onclick=function(){if(confirm('Сбросить демо-данные?')){localStorage.removeItem(KEY);load();sel=null;remSel=null;$('#today').value=S.today;render()}};
load();$('#today').value=S.today;render();
})();
</script>
