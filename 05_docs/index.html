  var groups={};
  trips.forEach(function(t){if(t.date<'2026-10-22'){var k=t.inn+'|'+Math.floor((Date.parse(t.date)-Date.parse(base))/(7*864e5));(groups[k]=groups[k]||[]).push(t)}});
  Object.keys(groups).forEach(function(k){
    var g=groups[k],last=g[g.length-1].date,s=makeSet(g,addDays(last,1),true);
    var pay=r()<.78;
    if(pay){var tt=setTotals(s).total,amt=r()<.85?tt:r2(Math.round(tt*0.6/100)*100);
      state.payments.push({id:state.paySeq++,inn:s.inn,date:addDays(s.date,6+Math.floor(r()*9)),sum:amt,doc:'п/п №'+(state.paySeq+7000)});}
    s.status.sent=true;s.status.exported=r()<.7;
    state.journal.push({ts:s.date+'T10:'+('0'+Math.floor(r()*50+10)).slice(-2),no:s.no,inn:s.inn,action:'Отправлен клиенту на e-mail',doc:'Комплект'});
    if(s.status.exported)state.journal.push({ts:s.date+'T11:20',no:s.no,inn:s.inn,action:'Выгружен в 1С',doc:'Комплект'});
  });
  state.journal.sort(function(a,b){return a.ts<b.ts?1:-1});
  state.payments=state.payments.filter(function(p){return p.date<='2026-11-06'});
  save();
}
function makeSet(trs,date,silent){

  trs.forEach(function(t){t.setId=s.id});

function download(name,text,mime){

  var start=month+'-01',ms=state.sets.filter(function(s){return s.inn===inn}),ps=state.payments.filter(function(p){return p.inn===inn});
  var open=0,rows=[];
  ms.forEach(function(s){var t=setTotals(s).total;if(s.date<start)open+=t;else if(s.date.slice(0,7)===month)rows.push({date:s.date,text:'Реализация: счёт, УПД и акт № '+s.no,d:t,c:0})});
  ps.forEach(function(p){if(p.date<start)open-=p.sum;else if(p.date.slice(0,7)===month)rows.push({date:p.date,text:'Оплата, '+p.doc,d:0,c:p.sum})});
  rows.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
  open=r2(open);var D=0,C=0;rows.forEach(function(r){D+=r.d;C+=r.c});D=r2(D);C=r2(C);
  return{open:open,rows:rows,D:D,C:C,close:r2(open+D-C)};
}
function lastDay(m){var p=m.split('-');return new Date(Date.UTC(+p[0],+p[1],0)).toISOString().slice(0,10)}
function reconSheet(inn,month){
  var c=cl(inn),d=reconData(inn,month),p=month.split('-'),end=lastDay(month);
  if(month==='2026-11')end=todayIso();
  var h='<div class="sheet"><h2 style="text-align:center">Акт сверки взаимных расчётов</h2><div style="text-align:center">за период с 01.'+p[1]+'.'+p[0]+' по '+ruDate(end)+'</div>'+
  '<p>Мы, нижеподписавшиеся, '+esc(SELLER.name)+' (ИНН '+SELLER.inn+') и '+esc(c.name)+' (ИНН '+c.inn+'), составили настоящий акт о том, что состояние взаимных расчётов по данным учёта следующее:</p>'+
  '<table><tr>'+th(['Дата','Операция','Дебет, ₽ (отгружено)','Кредит, ₽ (оплачено)'])+'</tr><tr><td colspan="2"><b>Сальдо на начало периода</b></td><td class="n">'+(d.open>0?fm(d.open):'')+'</td><td class="n">'+(d.open<0?fm(-d.open):'')+'</td></tr>';
  d.rows.forEach(function(r){h+='<tr><td>'+ruDate(r.date)+'</td><td>'+esc(r.text)+'</td><td class="n">'+(r.d?fm(r.d):'')+'</td><td class="n">'+(r.c?fm(r.c):'')+'</td></tr>'});
  h+='<tr><td colspan="2"><b>Обороты за период</b></td><td class="n"><b>'+fm(d.D)+'</b></td><td class="n"><b>'+fm(d.C)+'</b></td></tr><tr><td colspan="2"><b>Сальдо на конец периода</b></td><td class="n"><b>'+(d.close>0?fm(d.close):'')+'</b></td><td class="n"><b>'+(d.close<0?fm(-d.close):'')+'</b></td></tr></table>'+
  '<p>'+(d.close>0?'По данным '+esc(SELLER.name)+' задолженность '+esc(c.name)+' на '+ruDate(end)+' составляет <b>'+fm(d.close)+' руб.</b> ('+sumWords(d.close)+').':d.close<0?'По данным '+esc(SELLER.name)+' переплата '+esc(c.name)+' на '+ruDate(end)+' составляет <b>'+fm(-d.close)+' руб.</b> ('+sumWords(-d.close)+').':'Взаимных задолженностей нет.')+'</p>'+
  '<div class="sign"><div>От '+esc(SELLER.name)+'<br><br>______________ / '+esc(SELLER.buh)+'</div><div>От '+esc(c.name)+'<br><br>______________ / ______________</div></div><div class="stamp">Демо-образец. Реквизиты вымышленные.</div></div>';
  return h;
}
function renderRecon(){
  if(!reconF.client)reconF.client=CLIENTS[0].inn;
  var h='<div class="card"><h2>Акт сверки за месяц</h2><div class="fields"><div><label class="f">Клиент</label><select id="rC" style="width:100%">'+clientOpts(reconF.client)+'</select></div><div><label class="f">Месяц</label><select id="rM" style="width:100%"><option value="2026-10"'+(reconF.month==='2026-10'?' selected':'')+'>Октябрь 2026</option><option value="2026-11"'+(reconF.month==='2026-11'?' selected':'')+'>Ноябрь 2026</option></select></div></div>'+
   '<div class="row" style="margin-bottom:10px"><button class="btn" id="rPr">Печать / PDF</button><button class="btn sec" id="rMail">Отправить клиенту</button></div><div class="sheetwrap">'+reconSheet(reconF.client,reconF.month)+'</div></div>';
  $('#main').innerHTML=h;
  $('#rC').onchange=function(){reconF.client=this.value;renderRecon()};
  $('#rM').onchange=function(){reconF.month=this.value;renderRecon()};
  $('#rPr').onclick=function(){doPrint([reconSheet(reconF.client,reconF.month)],{no:'—',inn:reconF.client},'Акт сверки '+reconF.month)};
  $('#rMail').onclick=function(){state.journal.unshift({ts:new Date().toISOString().slice(0,16),no:'—',inn:reconF.client,action:'Акт сверки за '+reconF.month+' отправлен клиенту',doc:'Акт сверки'});save();toast('Акт сверки отправлен (демо)')};
}

/* ---------- Журнал ---------- */
function renderJournal(){
  var h='<div class="card"><div class="row"><h2 style="margin:0">Журнал документов</h2><span class="sp"></span><select id="jC">'+clientOpts(jf,'Все клиенты')+'</select><button class="btn dark sm" id="jX">Выгрузить в 1С всё невыгруженное (XML)</button></div>';
  var pend=state.sets.filter(function(s){return!s.status.exported}).length;
  h+='<div class="mut" style="margin:8px 0">Комплектов не выгружено в 1С: <b>'+pend+'</b></div><div class="tblwrap"><table class="t"><tr><th>Время</th><th>№</th><th>Клиент</th><th>Документ</th><th>Действие</th></tr>';
  var rows=state.journal.filter(function(j){return!jf||j.inn===jf});
  rows.forEach(function(j){var c=cl(j.inn);h+='<tr><td style="white-space:nowrap">'+ruDate(j.ts.slice(0,10))+' '+(j.ts.slice(11,16)||'')+'</td><td>'+esc(j.no)+'</td><td>'+esc(c?c.name:j.inn)+'</td><td>'+esc(j.doc)+'</td><td>'+esc(j.action)+'</td></tr>'});
  if(!rows.length)h+='<tr><td colspan="5" class="mut">Записей нет</td></tr>';
  h+='</table></div></div>';
  $('#main').innerHTML=h;
  $('#jC').onchange=function(){jf=this.value;renderJournal()};
  $('#jX').onclick=function(){exportSets(state.sets.filter(function(s){return!s.status.exported}),'xml')};
}

/* ---------- Справочник ---------- */
function renderDir(){
  var h='<div class="split"><div class="card"><h2>Реквизиты по ИНН</h2><label class="f">Введите ИНН (10 или 12 цифр)</label><div class="row"><input type="text" id="innIn" inputmode="numeric" maxlength="12" placeholder="например, 7726345181" style="flex:1"><button class="btn" id="innGo">Найти</button></div><div id="innRes"></div>'+
   '<div class="mut" style="margin-top:12px">Демо-справочник: '+CLIENTS.length+' клиентов. Попробуйте ИНН из списка справа.</div></div>'+
   '<div class="card"><h3>Справочник клиентов</h3><div class="tblwrap"><table class="t"><tr><th>Клиент</th><th>ИНН</th><th class="hm">КПП</th><th class="hm">Адрес</th></tr>';
  CLIENTS.forEach(function(c){h+='<tr class="clk" data-inn="'+c.inn+'"><td>'+esc(c.name)+'</td><td>'+c.inn+'</td><td class="hm">'+(c.kpp||'—')+'</td><td class="hm">'+esc(c.addr)+'</td></tr>'});
  h+='</table></div></div></div>';
  $('#main').innerHTML=h;
  function find(){
    var v=$('#innIn').value.replace(/\s/g,''),o=$('#innRes');
    if(!/^\d{10}$|^\d{12}$/.test(v)){o.innerHTML='<div class="box" style="border-color:var(--bad)">ИНН должен состоять из 10 или 12 цифр</div>';return}
    var warn=innValid(v)?'':'<div class="mut" style="color:var(--bad)">Контрольная цифра ИНН не сходится — проверьте номер</div>';
    var c=cl(v);
    if(!c){o.innerHTML='<div class="box">'+warn+'ИНН '+v+' в справочнике не найден. В боевой версии реквизиты подтянутся из базы ФНС и 1С.</div>';return}
    o.innerHTML='<div class="box">'+warn+'<div class="kv"><span>Название</span><b>'+esc(c.name)+'</b><span>ИНН / КПП</span><span>'+c.inn+' / '+(c.kpp||'—')+'</span><span>Адрес</span><span>'+esc(c.addr)+'</span><span>Банк</span><span>'+esc(c.bank)+', БИК '+c.bik+'</span><span>Расчётный счёт</span><span>'+c.rs+'</span><span>Контакт</span><span>'+esc(c.contact)+'</span></div></div>';
  }
  $('#innGo').onclick=find;$('#innIn').onkeydown=function(e){if(e.key==='Enter')find()};
  $$('tr[data-inn]').forEach(function(r){r.onclick=function(){$('#innIn').value=r.dataset.inn;find();window.scrollTo(0,0)}});
}

function setTab(t){tab=t;$$('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});render()}
function render(){({trips:renderTrips,docs:renderDocs,recon:renderRecon,journal:renderJournal,dir:renderDir})[tab]()}
$$('#tabs button').forEach(function(b){b.onclick=function(){setTab(b.dataset.t)}});
$('#reset').onclick=function(){if(confirm('Сбросить демо-данные?')){localStorage.removeItem(KEY);selTrips={};curSet=null;seed();render()}};
load();render();
</script>
