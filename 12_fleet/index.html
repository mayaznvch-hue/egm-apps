<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EGM · Учёт техники</title>
<style>
:root{--or:#F07A1A;--or2:#fff1e4;--g:#1F2329;--g2:#5b636d;--line:#e5e8ec;--bg:#f5f6f8;--ok:#1e9e5a;--bad:#d93a3a;--warn:#e6a100}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--g);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:var(--g)}
header{background:var(--g);color:#fff;position:sticky;top:0;z-index:20}
.hw{max-width:1400px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:18px}.logo b{color:var(--or)}
.badge{font-size:11px;background:var(--or);color:#fff;border-radius:10px;padding:2px 8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.sp{flex:1}
.alerts{font-size:13px;color:#fff;background:var(--bad);border-radius:12px;padding:2px 10px;font-weight:700;cursor:pointer;border:0}
.alerts.z{background:var(--ok);cursor:default}
nav{max-width:1400px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:8px 10px 0;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;color:#cfd4da;padding:9px 14px;border-radius:9px 9px 0 0;font-weight:600;cursor:pointer;white-space:nowrap;font-size:14.5px}
nav button.on{background:var(--bg);color:var(--g)}
main{max-width:1400px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{margin:0 0 12px;font-size:16px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;font-weight:600;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--or);color:var(--or)}
.btn.pr{background:var(--or);border-color:var(--or);color:#fff}.btn.pr:hover{background:#d96a0f;color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.dg:hover{border-color:var(--bad);color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:5px 13px;cursor:pointer;font-weight:600;font-size:13.5px}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
input[type=text],input[type=date],input[type=number],select,textarea{border:1px solid #d3d8de;border-radius:9px;padding:8px 10px;background:#fff;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--or2);border-color:var(--or)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.sum div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.sum b{display:block;font-size:22px}.sum span{color:var(--g2);font-size:12.5px}
.sum .r b{color:var(--bad)}.sum .y b{color:#b88300}.sum .gr b{color:var(--ok)}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:10px;font-weight:700;white-space:nowrap}
.pill.ok{background:#e3f5ea;color:#13753f}.pill.warn{background:#ffefbf;color:#7d5700}.pill.bad{background:#fde8e8;color:#b32525}.pill.no{background:#eef0f3;color:var(--g2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.vc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;border-top:4px solid var(--ok);cursor:pointer;min-width:0}
.vc.warn{border-top-color:var(--warn)}.vc.bad{border-top-color:var(--bad)}
.vc:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.vc h3{margin:0;font-size:16px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.plate{font-weight:800;background:#fff;border:2px solid var(--g);border-radius:6px;padding:0 7px;font-size:15px;white-space:nowrap;letter-spacing:.5px}
.vc small{color:var(--g2);font-size:13px}
.vc .pl{display:flex;gap:5px;flex-wrap:wrap;align-items:flex-start;align-content:flex-start}
.vc{grid-template-rows:auto auto 1fr auto}
.vc .ft{display:flex;justify-content:space-between;color:var(--g2);font-size:13px;gap:8px;flex-wrap:wrap}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--g2);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid #f0f2f4;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr.hl td{background:#fff7f7}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pb{background:#eef0f3;border-radius:6px;height:10px;overflow:hidden;margin:4px 0}.pb i{display:block;height:100%;background:var(--ok)}.pb i.warn{background:var(--warn)}.pb i.bad{background:var(--bad)}
.note{color:var(--g2);font-size:13px}
.frm{display:grid;gap:10px}.frm label{font-size:13px;color:var(--g2);display:grid;gap:3px}
.frm .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{padding:26px;text-align:center;color:var(--g2)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(31,35,41,.55);z-index:40;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px}
.ov.on{display:flex}
.sheet{background:var(--bg);border-radius:16px;width:100%;max-width:900px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px 18px;background:#fff;border-radius:16px 16px 0 0;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.sh-h h2{margin:0;font-size:18px;flex:1;min-width:0;overflow-wrap:anywhere}
.x{border:0;background:#eef0f3;border-radius:50%;width:38px;height:38px;font-size:22px;cursor:pointer;flex:none}
.sh-b{padding:16px;display:grid;gap:14px}
.sh-b.two{grid-template-columns:1fr 1fr}
.kv{display:grid;grid-template-columns:130px 1fr;gap:5px 10px;font-size:14px;align-items:center}
.kv dt{color:var(--g2)}.kv dd{margin:0;overflow-wrap:anywhere}
.mini{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mini input{width:130px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:12px;color:var(--g2);text-align:center;padding:4px 0;font-weight:700}
.cal .d{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:92px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden}
.cal .d.o{background:transparent;border-color:transparent}
.cal .d.t{border-color:var(--or);box-shadow:inset 0 0 0 1px var(--or)}
.cal .d b{font-size:12.5px;color:var(--g2)}
.cal .d.t b{color:var(--or)}
.ev{font-size:11.5px;border-radius:5px;padding:1px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ev.bad{background:#fde8e8;color:#b32525}.ev.warn{background:#ffefbf;color:#7d5700}.ev.ok{background:#e3f5ea;color:#13753f}
.agenda{display:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.3s;z-index:60;font-size:14px;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.cols{display:flex;align-items:flex-end;gap:6px;height:130px;margin:8px 0}
.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;min-width:0;height:100%}
.cols i{display:block;width:100%;background:var(--or);border-radius:5px 5px 0 0;min-height:2px}
.cols span{font-size:11px;color:var(--g2);white-space:nowrap}
@media(max-width:900px){.g2,.sh-b.two{grid-template-columns:1fr}}
@media(max-width:760px){
 main{padding:10px}.card{padding:12px}.ov{padding:0}.sheet{border-radius:0;min-height:100%}.sh-h{border-radius:0;padding:10px 12px}
 .hw{padding:8px 12px 0}.logo{font-size:16px}.grid{grid-template-columns:1fr}
 .cal{display:none}.agenda{display:grid;gap:6px}
 .agenda .ag{display:grid;grid-template-columns:70px 1fr;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;align-items:start}
 .agenda .ag b{font-size:13px}.agenda .ag.t{border-color:var(--or)}
 .agenda .ev{white-space:normal;font-size:13px;margin-bottom:3px}
 .kv{grid-template-columns:105px 1fr}
 .frm .two{grid-template-columns:1fr}
}
@media(min-width:761px){.agenda{display:none!important}}
</style>
</head>
<body>
<header>
 <div class="hw"><div class="logo"><b>EGM</b> · Учёт техники</div><span class="badge">демо</span><div class="sp"></div><button class="alerts" id="alr"></button></div>
 <nav id="nav"></nav>
</header>
<main id="main"></main>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var KEY='egm_fleet_v1';
var MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
var MONF=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var TYPES={dump:'Самосвал',loader:'Погрузчик',exc:'Экскаватор',crane:'Манипулятор'};
var PT=['ТТК','МКАД','СК'];
var PTN={ТТК:'Пропуск ТТК',МКАД:'Пропуск МКАД',СК:'Пропуск СК'};
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function iso(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd}
function addD(n,from){var d=from?new Date(from+'T12:00:00'):new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return iso(d)}
var TODAY=iso(new Date());
function diffD(s){return Math.round((new Date(s+'T12:00:00')-new Date(TODAY+'T12:00:00'))/864e5)}
function fd(s){if(!s)return '—';var d=new Date(s+'T12:00:00');return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()}
function fds(s){var d=new Date(s+'T12:00:00');return d.getDate()+' '+MON[d.getMonth()]}
function fmt(n){return Math.round(n).toLocaleString('ru-RU')}
function f1(n){return (Math.round(n*10)/10).toLocaleString('ru-RU')}
function rng(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;var t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function toast(t){var e=$('toast');e.textContent=t;e.className='toast on';clearTimeout(toast.t);toast.t=setTimeout(function(){e.className='toast'},2400)}
function plural(n,a,b,c){n=Math.abs(n)%100;var m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c}
function daysTxt(n){return n+' '+plural(n,'день','дня','дней')}

/* ---------- данные ---------- */
function seed(){
 var r=rng(2026);
 var V=[
  {plate:'А 214 ВТ 750',model:'КамАЗ 6520',type:'dump',unit:'км',odo:284600,norm:38,cap:20,rate:12600,trips:52,driver:'Сергей Бойко'},
  {plate:'В 508 КН 750',model:'КамАЗ 6520',type:'dump',unit:'км',odo:312950,norm:38,cap:20,rate:12300,trips:49,driver:'Андрей Лукин'},
  {plate:'К 877 ОС 750',model:'КамАЗ 65115',type:'dump',unit:'км',odo:198400,norm:36,cap:15,rate:9800,trips:47,driver:'Игорь Мартынов'},
  {plate:'О 645 АА 750',model:'КамАЗ 6520',type:'dump',unit:'км',odo:156780,norm:38,cap:20,rate:12400,trips:44,driver:'Виктор Шаров'},
  {plate:'Р 902 ХН 190',model:'HOWO ZZ3327',type:'dump',unit:'км',odo:121300,norm:40,cap:25,rate:15200,trips:38,driver:'Руслан Гасанов'},
  {plate:'Т 077 ЕК 750',model:'КамАЗ 6520',type:'dump',unit:'км',odo:342100,norm:39,cap:20,rate:11800,trips:36,driver:'Николай Ермаков'},
  {plate:'Е 331 МР 190',model:'МАЗ 6501',type:'dump',unit:'км',odo:204900,norm:37,cap:20,rate:12000,trips:30,driver:'Олег Дёмин'},
  {plate:'Н 633 ОВ 750',model:'Scania P380',type:'dump',unit:'км',odo:267300,norm:35,cap:20,rate:12800,trips:22,driver:'Пётр Сухов'},
  {plate:'М 120 ТУ 150',model:'Амкодор ТО-18',type:'loader',unit:'мч',odo:6840,norm:11.5,cap:0,rate:2600,trips:150,driver:'Артём Шилов'},
  {plate:'ЕК 4821 77',model:'JCB 3CX',type:'exc',unit:'мч',odo:4260,norm:9.5,cap:0,rate:3100,trips:130,driver:'Максим Рябов'},
  {plate:'Х 415 РС 50',model:'КамАЗ 43118 КМУ',type:'crane',unit:'км',odo:176200,norm:34,cap:10,rate:9400,trips:24,driver:'Денис Жуков'}
 ];
 var ev=[[40,-6,26,300,60,-20],[10,18,1,50,240,200],[-3,40,16,330,420,110],[100,60,60,18,12,-5],[200,-1,6,140,300,150],[25,9,90,200,10,5],[15,70,50,320,110,100],[5,24,200,40,150,90],[130,12,15,190,45,50],[60,-9,100,80,80,70],[8,25,130,15,45,15]];
 var out=[];
 V.forEach(function(v,i){
  var every=v.unit==='км'?15000:250,e=ev[i];
  var lastTo=v.odo-Math.round(r()*(every*0.93)+every*0.04);
  if(i===1)lastTo=v.odo-every-640;
  if(i===2)lastTo=v.odo-every+900;
  if(i===7)lastTo=v.odo-every+2200;
  if(v.unit==='мч'){lastTo=v.odo-(i===8?232:120)}
  var o={id:i+1,plate:v.plate,model:v.model,type:v.type,unit:v.unit,odo:v.odo,norm:v.norm,cap:v.cap,rate:v.rate,trips:v.trips,driver:v.driver,
   to:{last:lastTo,every:every,date:addD(-Math.round(20+r()*60))},
   osago:addD(e[1]),dk:addD(e[2]),pass:{},
   pay:v.type==='dump'?95000:v.type==='crane'?100000:85000,fix:v.type==='dump'?95000:v.type==='crane'?80000:60000};
  o.pass.ТТК=v.type==='dump'||v.type==='crane'?addD(e[3]%200-10+(i%3)*8):null;
  o.pass.МКАД=v.type==='dump'||v.type==='crane'?addD(e[4]-20):null;
  o.pass.СК=v.type==='dump'?addD(e[5]+40):null;
  if(i===0)o.pass.ТТК=addD(5);if(i===1)o.pass.МКАД=addD(-2);if(i===3)o.pass.СК=addD(27);if(i===4)o.pass.ТТК=addD(13);
  if(i===9){o.pass.ТТК=null}
  out.push(o)});
 /* заправки: за 90 дней */
 var fuel=[],price=64.2,id=1;
 out.forEach(function(v,vi){
  var odo=v.odo,list=[],step=v.unit==='км'?(vi===7?900:1300):Math.round(36+r()*10),
      n=v.unit==='км'?Math.round(v.trips*3*1.6/ (v.trips>40?1.2:1)/ (1300/ (v.unit==='км'?1300:1)))+6:Math.round(90*5/8*0.9);
  var k;
  /* с конца: идём назад по пробегу */
  var cur=odo,d=1+Math.floor(r()*3);
  for(k=0;k<14&&d<92;k++){
   var dist=Math.round(step*(0.8+r()*0.4)),fact=v.norm*(0.94+r()*0.14);
   if((vi===7&&k%3===1)||(vi===1&&k===2)||(vi===5&&k===4)||(vi===10&&k===1))fact=v.norm*(1.32+r()*0.2);
   var lit=Math.round(dist*(v.unit==='км'?fact/100:fact));
   list.push({d:addD(-d),prev:cur-dist,odo:cur,l:lit,p:Math.round((price-d*0.012)*10)/10});
   cur-=dist;d+=Math.round(5+r()*4)}
  list.forEach(function(x){fuel.push({id:id++,v:v.id,d:x.d,prev:x.prev,odo:x.odo,l:x.l,p:x.p})})});
 /* ремонты */
 var rep=[],rid=1,R=[
  [1,-18,'Замена тормозных колодок передней оси',16800,'Колодки, работа'],[2,-6,'Ремонт пневмоподвески',28400,'Баллоны, работа'],[2,-41,'Замена масла и фильтров (ТО)',14200,'Масло, фильтры'],
  [3,-12,'Замена сцепления',52000,'Комплект сцепления'],[3,-60,'Шиномонтаж, 2 колеса',9800,'Шины'],[4,-25,'Замена топливных форсунок',34500,'Форсунки'],
  [6,-33,'Ремонт кузова: подъёмный цилиндр',46000,'Гидроцилиндр'],[6,-9,'Замена генератора',19800,'Генератор'],[8,-4,'Замена колёс, 4 шт',68000,'Шины'],[8,-22,'Ремонт КПП, диагностика',24500,'Работа'],[8,-50,'Замена ремня ГРМ',21400,'Комплект'],
  [9,-15,'Замена гидрошлангов',17600,'Шланги'],[10,-28,'Ремонт ковша: наплавка зубьев',22400,'Работа, зубья'],[11,-11,'Замена гидрораспределителя КМУ',58000,'Распределитель'],[5,-70,'Плановое ТО',16900,'Масло, фильтры'],[7,-35,'Замена амортизаторов',14900,'Амортизаторы']];
 R.forEach(function(x){rep.push({id:rid++,v:x[0],d:addD(x[1]),what:x[2],cost:x[3],note:x[4]})});
 return {v:1,V:out,F:fuel,R:rep,fid:id+100,rid:rid+100,vid:100,E:[]};
}
var S=null;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}if(!S||!S.V)S=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Не удалось сохранить в браузере')}}
load();
function vById(id){for(var i=0;i<S.V.length;i++)if(S.V[i].id===id)return S.V[i]}

/* ---------- расчёты ---------- */
function lv(days){return days<0?'bad':days<=7?'bad':days<=30?'warn':'ok'}
function dtxt(days){return days<0?'просрочено на '+daysTxt(-days):days===0?'истекает сегодня':'через '+daysTxt(days)}
function toLeft(v){return v.to.last+v.to.every-v.odo}
function toLv(v){var l=toLeft(v),w=v.unit==='км'?1500:30;return l<=0?'bad':l<=w?'warn':'ok'}
function toTxt(v){var l=toLeft(v);return l<=0?'перепробег '+fmt(-l)+' '+v.unit:'осталось '+fmt(l)+' '+v.unit}
function perDay(v){return v.unit==='км'?v.trips/30*v.cap*3.3+10:5.4}
function toDate(v){var l=toLeft(v);if(l<=0)return TODAY;var pd=v.unit==='км'?(v.trips/30*(v.type==='crane'?55:v.cap?60:60)):7;return addD(Math.max(1,Math.round(l/Math.max(pd,1))))}
function docs(v){var a=[];
 a.push({k:'osago',t:'ОСАГО',date:v.osago,days:diffD(v.osago)});
 a.push({k:'dk',t:'Диагностическая карта',date:v.dk,days:diffD(v.dk)});
 PT.forEach(function(p){if(v.pass&&v.pass[p])a.push({k:'p'+p,t:PTN[p],date:v.pass[p],days:diffD(v.pass[p])})});
 a.forEach(function(x){x.lv=lv(x.days)});return a}
function worst(v){var w='ok',l=toLv(v);if(l==='bad')w='bad';else if(l==='warn')w='warn';
 docs(v).forEach(function(d){if(d.lv==='bad')w='bad';else if(d.lv==='warn'&&w==='ok')w='warn'});return w}
function alerts(){var a=[];S.V.forEach(function(v){docs(v).forEach(function(d){if(d.lv!=='ok')a.push({v:v,t:d.t,lv:d.lv,txt:dtxt(d.days),days:d.days,k:d.k})});if(toLv(v)!=='ok')a.push({v:v,t:'ТО',lv:toLv(v),txt:toTxt(v),days:toLeft(v)<=0?-1:Math.round(toLeft(v)/(v.unit==='км'?200:7)),k:'to'})});
 return a.sort(function(x,y){return (x.lv==='bad'?0:1)-(y.lv==='bad'?0:1)||x.days-y.days})}
/* расход */

 var right='<div class="card"><h2>Прибыль за 30 дней</h2><dl class="kv"><dt>Доход</dt><dd>'+fmt(e.inc)+' ₽</dd><dt>Топливо</dt><dd>'+fmt(e.fuel)+' ₽</dd><dt>Ремонты</dt><dd>'+fmt(e.rep)+' ₽</dd><dt>Зарплата и прочее</dt><dd>'+fmt(e.pay+e.fix)+' ₽</dd><dt><b>Прибыль</b></dt><dd><b style="color:'+(e.profit<0?'var(--bad)':'var(--ok)')+'">'+fmt(e.profit)+' ₽</b> ('+Math.round(e.mar)+'%)</dd></dl></div>'+
 '<div class="card" style="margin-top:12px"><h2>Последние заправки</h2>'+(fl.length?'<div class="scroll"><table><tr><th>Дата</th><th class="n">Литров</th><th class="n">Расход</th></tr>'+fl.map(function(f){var o=over(v,f);return '<tr><td>'+fds(f.d)+'</td><td class="n">'+f.l+'</td><td class="n">'+pillF(o>15?'bad':o>8?'warn':'ok',f1(fact(v,f)))+'</td></tr>'}).join('')+'</table></div>':'<div class="note">Заправок нет.</div>')+'<div style="margin-top:8px"><button class="btn sm" data-addf="'+id+'">+ Заправка</button></div></div>'+
 '<div class="card" style="margin-top:12px"><h2>Ремонты</h2>'+(rp.length?'<div class="scroll"><table>'+rp.map(function(r){return '<tr><td>'+fds(r.d)+'</td><td>'+esc(r.what)+'</td><td class="n">'+fmt(r.cost)+' ₽</td></tr>'}).join('')+'</table></div>':'<div class="note">Ремонтов нет.</div>')+'<div style="margin-top:8px"><button class="btn sm" data-addr="'+id+'">+ Ремонт</button> <button class="btn sm dg" data-delv="'+id+'">Убрать машину</button></div></div>';
 openSheet('<span class="plate">'+esc(v.plate)+'</span> '+esc(v.model),'<div class="sh-b two"><div>'+left+'</div><div>'+right+'</div></div>')}
function openSheet(title,body){$('sheet').innerHTML='<div class="sh-h"><h2>'+title+'</h2><button class="x" data-close="1" aria-label="Закрыть">×</button></div>'+body;$('ov').className='ov on';document.body.style.overflow='hidden';$('ov').scrollTop=0}
function closeSheet(){$('ov').className='ov';document.body.style.overflow='';$('sheet').innerHTML='';U.vid=null}
function vOpts(sel){return S.V.map(function(v){return '<option value="'+v.id+'"'+(sel===v.id?' selected':'')+'>'+esc(v.plate)+' · '+esc(v.model)+'</option>'}).join('')}
function formSheet(title,html,btn,act){openSheet(title,'<div class="sh-b" style="max-width:560px"><div class="card frm">'+html+'<div class="note" id="fe" style="color:var(--bad)"></div><button class="btn pr" data-act="'+act+'">'+btn+'</button></div></div>')}
function openFuel(vid){var v=vById(vid)||S.V[0];formSheet('Новая заправка','<label>Машина<select id="fV">'+vOpts(v.id)+'</select></label><div class="two"><label>Дата<input type="date" id="fD" value="'+TODAY+'"></label><label>Литров<input type="number" id="fL" min="1"></label></div><div class="two"><label>Показание (км или мч) сейчас<input type="number" id="fO" value="'+v.odo+'"></label><label>Цена, ₽/л<input type="number" id="fP" step="0.1" value="63.5"></label></div><div class="note">Расход считается по пробегу с прошлой заправки до полного бака.</div>','Сохранить','savef')}
function saveFuel(){var v=vById(+$('fV').value),l=+$('fL').value,o=+$('fO').value,p=+$('fP').value;if(!(l>0)){$('fe').textContent='Укажите литры.';return}if(!(o>0)){$('fe').textContent='Укажите показание.';return}
 var prev=v.odo;if(o<=prev){$('fe').textContent='Показание должно быть больше текущего ('+fmt(prev)+' '+v.unit+').';return}
 S.F.push({id:S.fid++,v:v.id,d:$('fD').value||TODAY,prev:prev,odo:o,l:l,p:p||63.5});v.odo=o;save();
 var f=S.F[S.F.length-1],ov=over(v,f);closeSheet();render();toast(ov>15?'Сохранено. Перерасход '+Math.round(ov)+'% — проверьте!':'Заправка сохранена, расход '+f1(fact(v,f)))}
function openRep(vid){formSheet('Новый ремонт','<label>Машина<select id="rV">'+vOpts(vid||S.V[0].id)+'</select></label><div class="two"><label>Дата<input type="date" id="rD" value="'+TODAY+'"></label><label>Сумма, ₽<input type="number" id="rC" min="0"></label></div><label>Что сделано<input type="text" id="rW" placeholder="Например: замена сцепления"></label><label>Запчасти и заметка<input type="text" id="rN"></label>','Сохранить','saver')}
function saveRep(){var w=$('rW').value.trim(),c=+$('rC').value;if(!w){$('fe').textContent='Опишите, что сделано.';return}if(!(c>=0)||$('rC').value===''){$('fe').textContent='Укажите сумму.';return}
 S.R.push({id:S.rid++,v:+$('rV').value,d:$('rD').value||TODAY,what:w,cost:c,note:$('rN').value.trim()||'—'});save();closeSheet();render();toast('Ремонт записан')}
function openAddV(){formSheet('Новая техника','<div class="two"><label>Госномер<input type="text" id="nP" placeholder="А 123 БВ 750"></label><label>Модель<input type="text" id="nM" placeholder="КамАЗ 6520"></label></div><div class="two"><label>Тип<select id="nT">'+Object.keys(TYPES).map(function(k){return '<option value="'+k+'">'+TYPES[k]+'</option>'}).join('')+'</select></label><label>Водитель<input type="text" id="nD"></label></div><div class="two"><label>Наработка (км или мч)<input type="number" id="nO" min="0"></label><label>Норма расхода (л/100 км или л/мч)<input type="number" id="nN" step="0.1"></label></div><div class="two"><label>ОСАГО до<input type="date" id="nA" value="'+addD(200)+'"></label><label>Диагн. карта до<input type="date" id="nK" value="'+addD(200)+'"></label></div>','Добавить','savev')}
function saveVeh(){var p=$('nP').value.trim(),m=$('nM').value.trim(),t=$('nT').value,o=+$('nO').value,n=+$('nN').value;if(!p||!m){$('fe').textContent='Укажите госномер и модель.';return}
 if(S.V.some(function(x){return x.plate.replace(/\s/g,'').toLowerCase()===p.replace(/\s/g,'').toLowerCase()})){$('fe').textContent='Такая машина уже есть.';return}
 if(!(n>0)){$('fe').textContent='Укажите норму расхода.';return}
 var u=t==='dump'||t==='crane'?'км':'мч',ev=u==='км'?15000:250;
 S.V.push({id:S.vid++,plate:p,model:m,type:t,unit:u,odo:o,norm:n,cap:t==='dump'?20:0,rate:u==='км'?12000:2800,trips:u==='км'?30:120,driver:$('nD').value.trim()||'не назначен',to:{last:o,every:ev,date:TODAY},osago:$('nA').value||addD(365),dk:$('nK').value||addD(365),pass:{ТТК:null,МКАД:null,СК:null},pay:95000,fix:90000});
 save();closeSheet();render();toast('Техника добавлена')}
function openEvt(){formSheet('Новое событие','<label>Название<input type="text" id="eT" placeholder="Например: осмотр у страховщика"></label><label>Дата<input type="date" id="eD" value="'+TODAY+'"></label>','Добавить','savee')}
function saveEvt(){var t=$('eT').value.trim();if(!t){$('fe').textContent='Введите название.';return}S.E.push({d:$('eD').value||TODAY,t:t});save();closeSheet();render();toast('Событие добавлено')}

/* ---------- события ---------- */
document.addEventListener('click',function(e){var t=e.target,el;
 if(t===$('ov')){closeSheet();return}
 if(t.closest('#alr')){var b=$('alr');if(b.getAttribute('data-go')){U.tab='dates';render();window.scrollTo(0,0)}return}
 if((el=t.closest('#nav button'))){U.tab=el.dataset.t;render();window.scrollTo(0,0);return}
 if(t.closest('[data-close]')){closeSheet();return}
 if((el=t.closest('[data-flt]'))){U.flt=el.dataset.flt;render();return}
 if((el=t.closest('[data-per]'))){U.per=+el.dataset.per;render();return}
 if((el=t.closest('[data-sort]'))){U.sort=el.dataset.sort;render();return}
 if((el=t.closest('[data-cm]'))){var n=+el.dataset.cm;if(!n){U.cal.y=new Date().getFullYear();U.cal.m=new Date().getMonth()}else{U.cal.m+=n;if(U.cal.m<0){U.cal.m=11;U.cal.y--}if(U.cal.m>11){U.cal.m=0;U.cal.y++}}render();return}
 if((el=t.closest('[data-addv]'))){openAddV();return}
 if((el=t.closest('[data-addf]'))){openFuel(+el.dataset.addf||null);return}
 if((el=t.closest('[data-addr]'))){openRep(+el.dataset.addr||null);return}
 if((el=t.closest('[data-adde]'))){openEvt();return}
 if((el=t.closest('[data-act]'))){var a=el.dataset.act;({savef:saveFuel,saver:saveRep,savev:saveVeh,savee:saveEvt})[a]();return}
 if((el=t.closest('[data-delf]'))){S.F=S.F.filter(function(f){return f.id!==+el.dataset.delf});save();render();toast('Заправка удалена');return}
 if((el=t.closest('[data-delr]'))){S.R=S.R.filter(function(r){return r.id!==+el.dataset.delr});save();render();toast('Ремонт удалён');return}
 if((el=t.closest('[data-delv]'))){if(confirm('Убрать машину и все её записи?')){var id=+el.dataset.delv;S.V=S.V.filter(function(v){return v.id!==id});S.F=S.F.filter(function(f){return f.v!==id});S.R=S.R.filter(function(r){return r.v!==id});save();closeSheet();render();toast('Машина убрана')}return}
 if((el=t.closest('[data-odo]'))){var v=vById(+el.dataset.odo),o=+$('odoI').value;if(!(o>=v.odo)){toast('Показание не может быть меньше текущего');return}v.odo=o;save();openV(v.id);render();toast('Наработка обновлена');return}
 if((el=t.closest('[data-todo]'))){var v2=vById(+el.dataset.todo);v2.to.last=v2.odo;v2.to.date=TODAY;save();if(U.vid)openV(v2.id);render();toast('ТО отмечено на '+fmt(v2.odo)+' '+v2.unit);return}
 if((el=t.closest('[data-ren]'))){var p=el.dataset.ren.split(':'),v3=vById(+p[0]);renew(v3,p[1],null);return}
 if((el=t.closest('[data-ren2]'))){var p2=el.dataset.ren2.split(':'),v4=vById(+p2[0]);renew(v4,p2[1],$('rn_'+p2[1]).value);return}
 if((el=t.closest('[data-v]'))){openV(+el.dataset.v);return}
});
function renew(v,k,date){var cur=k==='osago'?v.osago:k==='dk'?v.dk:v.pass[k.slice(1)];var nd=date||addD(365,diffD(cur)<0?TODAY:cur);
 if(k==='osago')v.osago=nd;else if(k==='dk')v.dk=nd;else v.pass[k.slice(1)]=nd;save();if(U.vid)openV(v.id);render();toast('Продлено до '+fd(nd))}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('ov').className==='ov on')closeSheet()});
window.__egm={S:function(){return S},U:U,alerts:alerts,fuelStats:fuelStats,econ:econ,fills:fills,over:over};
render();
})();
