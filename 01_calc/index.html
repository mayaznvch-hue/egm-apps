<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EGM · Калькулятор цены с доставкой</title>
<style>
:root{--or:#F07A1A;--or2:#d96a0e;--gr:#1F2329;--gr2:#4a525c;--line:#e3e6ea;--bg:#f5f6f8;--ok:#1f9d55;--bad:#d64545}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--gr);font-size:15px;line-height:1.4}
header{background:var(--gr);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:18px;font-weight:700}
header h1 b{color:var(--or)}
.tag{font-size:11px;background:var(--or);color:#fff;border-radius:10px;padding:2px 8px;text-transform:uppercase;letter-spacing:.4px}
nav{margin-left:auto;display:flex;gap:6px}
nav button{background:transparent;border:1px solid #4a525c;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--or);border-color:var(--or)}
nav .cnt{background:#fff;color:var(--gr);border-radius:9px;padding:0 6px;font-size:12px;margin-left:4px}
main{max-width:1200px;margin:0 auto;padding:18px}
.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.card h2{margin:0 0 12px;font-size:17px}
label{display:block;font-size:13px;color:var(--gr2);margin:12px 0 5px}
select,input,textarea{width:100%;padding:10px 12px;border:1px solid #cfd4da;border-radius:8px;font:inherit;background:#fff;color:var(--gr)}
select:focus,input:focus,textarea:focus{outline:2px solid #f9c79b;border-color:var(--or)}
.row{display:flex;gap:10px}.row>*{flex:1}
.seg{display:flex;border:1px solid #cfd4da;border-radius:8px;overflow:hidden;flex:0 0 auto;width:150px}
.seg button{flex:1;border:0;background:#fff;padding:10px;cursor:pointer;font:inherit}
.seg button.on{background:var(--gr);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #cfd4da;background:#fff;border-radius:18px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--or);border-color:var(--or);color:#fff}
.hint{background:#fff6ee;border:1px solid #f9d6b6;border-radius:10px;padding:12px;margin-top:14px}
.hint b{color:var(--or2)}
.hint button{margin-top:8px}
.btn{background:var(--or);color:#fff;border:0;border-radius:8px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--or2)}
.btn.ghost{background:#fff;color:var(--gr);border:1px solid #cfd4da;font-weight:400}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.big{width:100%;margin-top:14px;font-size:16px;padding:14px}
.sum dl{margin:0}
.sum .ln{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.sum .ln span:first-child{color:var(--gr2)}
.sum .ln small{display:block;color:#8a929b}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:15px}
.total strong{font-size:30px;color:var(--or2)}
.info{margin-top:10px;font-size:13px;color:var(--gr2);background:var(--bg);border-radius:8px;padding:10px}
.warn{color:var(--bad)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{font-size:12px;color:var(--gr2);text-transform:uppercase;letter-spacing:.3px}
.st{display:inline-block;border-radius:10px;padding:2px 9px;font-size:12px;color:#fff}
.st.new{background:var(--or)}.st.work{background:#3b7ddd}.st.done{background:var(--ok)}.st.cancel{background:#8a929b}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools select,.tools input{width:auto;min-width:150px}
.modal{position:fixed;inset:0;background:rgba(31,35,41,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:10}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:440px;max-height:95vh;overflow:auto}
.modal h3{margin:0 0 4px}
.err{color:var(--bad);font-size:12px;min-height:14px;margin-top:3px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--gr);color:#fff;padding:12px 18px;border-radius:10px;display:none;z-index:20;max-width:90vw}
.hide{display:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stats div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stats b{display:block;font-size:22px;color:var(--or2)}
.stats span{font-size:12px;color:var(--gr2)}
.cards{display:none}
@media(max-width:820px){
 .grid{grid-template-columns:1fr}
 header{padding:10px 12px}nav{margin-left:0;width:100%}nav button{flex:1}
 main{padding:10px}
 .stats{grid-template-columns:repeat(2,1fr)}
 table{display:none}.cards{display:block}
 .oc{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
 .oc .h{display:flex;justify-content:space-between;margin-bottom:6px}
 .oc p{margin:3px 0;font-size:14px}
 .oc .act{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
 .total strong{font-size:26px}
 .r2{flex-direction:column;gap:0}
 .tools select,.tools input{width:100%}
 .chip{padding:9px 16px}
 .modal .row{flex-wrap:nowrap}
}
</style>
</head>
<body>
<header>
 <h1><b>EGM</b> · Калькулятор цены с доставкой</h1><span class="tag">демо</span>
 <nav>
  <button id="tabCalc" class="on" onclick="tab('calc')">Калькулятор</button>
  <button id="tabOrders" onclick="tab('orders')">Заявки с сайта <span class="cnt" id="cntNew">0</span></button>
 </nav>
</header>
<main>
<section id="viewCalc">
 <div class="grid">
  <div class="card">
   <h2>Что и куда везём</h2>
   <label>Что вам нужно построить или засыпать? (подскажем материал)</label>
   <select id="purpose" onchange="showHint()">
    <option value="">— выберите задачу —</option>
    <option value="found">Фундамент, бетон</option>
    <option value="path">Садовая дорожка, площадка</option>
    <option value="road">Дорога, подъездной путь</option>
    <option value="fill">Подсыпка, выравнивание участка</option>
    <option value="drain">Дренаж, водоотвод</option>
    <option value="pit">Засыпка котлована, траншеи</option>
    <option value="mix">Кладка, штукатурка, пескоструй</option>
   </select>
   <div id="hint" class="hint hide"></div>

   <div class="row r2">
    <div><label>Материал</label><select id="mat" onchange="fillFr();calc()"></select></div>
    <div><label>Фракция</label><select id="fr" onchange="calc()"></select></div>
   </div>
   <label>Объём</label>
   <div class="row">
    <input id="qty" type="number" min="1" step="1" value="40" oninput="calc()">
    <div class="seg"><button id="uT" class="on" onclick="setUnit('t')">тонны</button><button id="uM" onclick="setUnit('m')">м³</button></div>
   </div>
   <div class="chips" style="margin-top:8px" id="qchips"></div>
   <label>Адрес доставки</label>
   <input id="addr" list="towns" placeholder="Например: Балашиха, ул. Советская, 10" oninput="guessZone()">
   <datalist id="towns"></datalist>
   <label>Удалённость от карьера (зона)</label>
   <select id="zone" onchange="calc()"></select>
   <div class="err" id="zoneNote"></div>
  </div>

  <div class="card sum">
   <h2>Расчёт</h2>
   <dl id="lines"></dl>
   <div class="total"><span>Итого с доставкой</span><strong id="total">0 ₽</strong></div>
   <div class="info" id="perT"></div>
   <div class="info" id="eta"></div>
   <button class="btn big" onclick="openOrder()">Оформить заказ</button>
   <button class="btn ghost big" style="margin-top:8px;font-size:14px;padding:10px" onclick="copyCalc()">Скопировать расчёт</button>
  </div>
 </div>
</section>

<section id="viewOrders" class="hide">
 <div class="stats">
  <div><b id="sAll">0</b><span>всего заявок</span></div>
  <div><b id="sNew">0</b><span>новых</span></div>
  <div><b id="sT">0</b><span>тонн в заявках</span></div>
  <div><b id="sSum">0</b><span>сумма, ₽</span></div>
 </div>
 <div class="card">
  <h2>Заявки с сайта</h2>
  <div class="tools">
   <select id="fSt" onchange="renderOrders()"><option value="">Все статусы</option><option value="new">Новые</option><option value="work">В работе</option><option value="done">Выполнены</option><option value="cancel">Отменены</option></select>
   <input id="fQ" placeholder="Поиск: имя, телефон, адрес" oninput="renderOrders()">
   <button class="btn ghost sm" onclick="resetDemo()">Вернуть демо-данные</button>
  </div>
  <table><thead><tr><th>№ / дата</th><th>Клиент</th><th>Заказ</th><th>Адрес и время</th><th>Сумма</th><th>Статус</th><th></th></tr></thead><tbody id="tb"></tbody></table>
  <div class="cards" id="cards"></div>
  <p id="empty" class="hide" style="color:var(--gr2)">Заявок по такому фильтру нет.</p>
 </div>
</section>
</main>

<div class="modal" id="modal"><div class="box">
 <h3>Оформление заказа</h3>
 <div id="mSum" class="info" style="margin-bottom:6px"></div>
 <label>Ваше имя</label><input id="fName" placeholder="Иван Петров">
 <div class="err" id="eName"></div>
 <label>Телефон</label><input id="fPhone" inputmode="tel" placeholder="+7 (9__) ___-__-__" oninput="maskPhone(this)">
 <div class="err" id="ePhone"></div>
 <div class="row">
  <div><label>Дата подачи</label><input id="fDate" type="date"></div>
  <div><label>Время</label><select id="fTime"></select></div>
 </div>
 <div class="err" id="eDate"></div>
 <label>Комментарий (подъезд, въезд, ограничения по высоте)</label><textarea id="fCom" rows="2"></textarea>
 <div class="row" style="margin-top:14px"><button class="btn ghost" onclick="closeOrder()">Отмена</button><button class="btn" onclick="sendOrder()">Отправить заявку</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const DENS={sand:1.5,crush:1.4,pgs:1.65,soil:1.6};
const MATS={
 gran:{n:'Щебень гранитный',d:'crush',fr:{'5-20':2600,'20-40':2450,'40-70':2300}},
 grav:{n:'Щебень гравийный',d:'crush',fr:{'5-20':2200,'20-40':2100,'40-70':2000}},
 lime:{n:'Щебень известняковый',d:'crush',fr:{'5-20':2050,'20-40':2000,'40-70':2000}},
 rec:{n:'Щебень вторичный',d:'crush',fr:{'0-40':1500,'20-70':1400}},
 sandK:{n:'Песок карьерный',d:'sand',fr:{'обычный':700}},
 sandM:{n:'Песок мытый',d:'sand',fr:{'обычный':950,'крупный':1000}},
 pgs:{n:'ПГС (песчано-гравийная смесь)',d:'pgs',fr:{'природная':800,'обогащённая':900}},
 soil:{n:'Грунт растительный',d:'soil',fr:{'плодородный':550,'планировочный':300}}
};
const ZONES=[
 {id:'mkad',n:'Москва, в пределах МКАД',km:'0–15 км',trip:6500,h:3},
 {id:'z30',n:'До 30 км от МКАД',km:'до 30 км',trip:9500,h:4},
 {id:'z60',n:'30–60 км от МКАД',km:'30–60 км',trip:13500,h:5},
 {id:'z100',n:'60–100 км от МКАД',km:'60–100 км',trip:19500,h:7}
];
const TOWNS={'москва':'mkad','зеленоград':'z30','балашиха':'z30','мытищи':'z30','химки':'z30','люберцы':'z30','красногорск':'z30','королёв':'z30','королев':'z30','одинцово':'z30','видное':'z30','реутов':'z30','котельники':'z30','подольск':'z60','домодедово':'z60','раменское':'z60','пушкино':'z60','щёлково':'z60','щелково':'z60','сергиев посад':'z60','ногинск':'z60','истра':'z60','жуковский':'z60','звенигород':'z60','чехов':'z60','клин':'z100','коломна':'z100','серпухов':'z100','орехово-зуево':'z100','дмитров':'z100','можайск':'z100','егорьевск':'z100','волоколамск':'z100','кашира':'z100','павловский посад':'z60'};
const PURP={
 found:{t:'Для фундамента и бетона',m:'gran',f:'5-20',txt:'Гранитный щебень 5-20 — самый прочный, его берут в бетон. Для подушки под фундамент можно 20-40.'},
 path:{t:'Для дорожки и площадки',m:'grav',f:'5-20',txt:'Гравийный щебень 5-20 — недорогой и аккуратный. Сверху обычно сыплют слой песка.'},
 road:{t:'Для дороги и подъезда',m:'gran',f:'40-70',txt:'Гранитный щебень 40-70 в основание, сверху 20-40. Держит нагрузку от грузовиков.'},
 fill:{t:'Для подсыпки участка',m:'pgs',f:'природная',txt:'ПГС — самый дешёвый способ поднять уровень. Хорошо трамбуется.'},
 drain:{t:'Для дренажа',m:'gran',f:'20-40',txt:'Щебень 20-40 пропускает воду и не заиливается. Гранитный служит дольше известнякового.'},
 pit:{t:'Для засыпки котлована',m:'sandK',f:'обычный',txt:'Карьерный песок — дёшево и хорошо уплотняется слоями по 30 см. Если дальше строить — лучше ПГС.'},
 mix:{t:'Для кладки и штукатурки',m:'sandM',f:'обычный',txt:'Мытый песок без глины и примесей — подходит для растворов и стяжки.'}
};
let unit='t', curOrder=null;

function init(){
 $('mat').innerHTML=Object.entries(MATS).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('');
 $('zone').innerHTML=ZONES.map(z=>`<option value="${z.id}">${z.n} — рейс ${fmt(z.trip)}</option>`).join('');
 $('zone').value='z30';
 $('towns').innerHTML=Object.keys(TOWNS).map(t=>`<option value="${t[0].toUpperCase()+t.slice(1)}">`).join('');
 $('qchips').innerHTML=[20,40,60,100].map(v=>`<button class="chip" onclick="setQty(${v})">${v}</button>`).join('');
 fillFr();
 const d=new Date();d.setDate(d.getDate()+1);$('fDate').value=d.toISOString().slice(0,10);$('fDate').min=new Date().toISOString().slice(0,10);
 $('fTime').innerHTML=['07:00–09:00','09:00–12:00','12:00–15:00','15:00–18:00','В течение дня'].map(t=>`<option>${t}</option>`).join('');
 if(!localStorage.getItem('egm_calc_orders'))seed();
 calc();renderOrders();
}
function fillFr(){const m=MATS[$('mat').value];$('fr').innerHTML=Object.entries(m.fr).map(([k,p])=>`<option value="${k}">${k} — ${fmt(p)}/т</option>`).join('');}
function setUnit(u){const q=+$('qty').value||0;const dn=DENS[MATS[$('mat').value].d];
 if(u!==unit){$('qty').value=u==='m'?Math.round(q/dn):Math.round(q*dn);}
 unit=u;$('uT').classList.toggle('on',u==='t');$('uM').classList.toggle('on',u==='m');
 $('qchips').innerHTML=(u==='t'?[20,40,60,100]:[15,30,45,70]).map(v=>`<button class="chip" onclick="setQty(${v})">${v}</button>`).join('');calc();}
function setQty(v){$('qty').value=v;calc();}
function guessZone(){const a=$('addr').value.toLowerCase();let f=null;
 for(const t in TOWNS){if(a.includes(t)){f=TOWNS[t];break;}}
 if(a.includes('мкад')&&!a.includes('за мкад'))f='mkad';
 if(f){$('zone').value=f;const z=ZONES.find(z=>z.id===f);$('zoneNote').style.color='#1f9d55';$('zoneNote').textContent='Зона определена по адресу: '+z.n;}
 else{$('zoneNote').textContent='';}
 calc();}
function showHint(){const p=PURP[$('purpose').value];const h=$('hint');
 if(!p){h.classList.add('hide');return;}
 const m=MATS[p.m];h.classList.remove('hide');
 h.innerHTML=`<b>${p.t}:</b> ${m.n} ${p.f}.<br>${p.txt}<br><button class="btn sm" onclick="applyHint()">Выбрать это</button>`;}
function applyHint(){const p=PURP[$('purpose').value];$('mat').value=p.m;fillFr();$('fr').value=p.f;calc();toast('Материал выбран: '+MATS[p.m].n+' '+p.f);}

let R=null;
function calc(){
 const m=MATS[$('mat').value],fr=$('fr').value,price=m.fr[fr],dn=DENS[m.d];
 const q=Math.max(0,+$('qty').value||0),z=ZONES.find(z=>z.id===$('zone').value);
 const tons=unit==='t'?q:q*dn, m3=unit==='m'?q:q/dn;
 const trips=tons>0?Math.max(Math.ceil(tons/20-1e-9),Math.ceil(m3/15-1e-9)):0;
 const mat=tons*price, del=trips*z.trip;
 const tot=mat+del;
 R={m,fr,price,dn,tons,m3,trips,z,mat,del,tot,q};
 $('lines').innerHTML=`
  <div class="ln"><span>${m.n}, ${fr}<small>${price.toLocaleString('ru-RU')} ₽/т · плотность ${dn} т/м³</small></span><span></span></div>
  <div class="ln"><span>Объём<small>${unit==='t'?'пересчёт в кубы':'пересчёт в тонны'}</small></span><span>${tons.toFixed(1)} т / ${m3.toFixed(1)} м³</span></div>
  <div class="ln"><span>Материал</span><span>${fmt(mat)}</span></div>
  <div class="ln"><span>Самосвалов (20 т / 15 м³)<small>${z.n}</small></span><span>${trips} × ${fmt(z.trip)}</span></div>
  <div class="ln"><span>Доставка</span><span>${fmt(del)}</span></div>`;
 $('total').textContent=fmt(tot);
 $('perT').innerHTML=tons>0?`Цена за тонну с доставкой: <b>${fmt(tot/tons)}</b>`+(trips>0&&tons%20!==0&&tons/20>1?`<br>Последний рейс неполный — довезите до ${trips*20} т, и тонна выйдет дешевле: <b>${fmt((trips*20*price+del)/(trips*20))}</b>`:''):'Введите объём';
 const now=new Date(),after=now.getHours()>=15;
 let eta;
 if(trips===0)eta='';
 else if(trips<=2&&!after)eta=`Подача сегодня, примерно через ${z.h}–${z.h+2} ч после подтверждения.`;
 else if(trips<=2)eta='Подача завтра с 7:00 (заявки после 15:00 берём на следующий день).';
 else{const days=Math.ceil(trips/6);eta=`${trips} машин: подадим за ${days} ${days===1?'день':'дня'}, начиная с ${after?'завтра':'сегодня-завтра'}. Точный график согласует менеджер.`;}
 $('eta').innerHTML=eta?'Срок подачи: '+eta:'';
 R.eta=eta;
}
function copyCalc(){if(!R||!R.tons)return;
 const t=`EGM: ${R.m.n} ${R.fr}, ${R.tons.toFixed(1)} т, доставка ${R.z.n}, ${R.trips} маш. Итого ${fmt(R.tot)}`;
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Расчёт скопирован'),()=>toast(t));}

/* заказ */
function maskPhone(el){let d=el.value.replace(/\D/g,'');if(d[0]==='8'||d[0]==='7')d=d.slice(1);d=d.slice(0,10);
 let s='+7';if(d.length)s+=' ('+d.slice(0,3);if(d.length>=3)s+=') '+d.slice(3,6);if(d.length>=6)s+='-'+d.slice(6,8);if(d.length>=8)s+='-'+d.slice(8,10);el.value=s;}
function openOrder(){calc();if(!R.tons){toast('Сначала укажите объём');return;}
 $('mSum').innerHTML=`${R.m.n} ${R.fr}, ${R.tons.toFixed(1)} т · ${R.trips} маш.<br><b>${fmt(R.tot)}</b> с доставкой${$('addr').value?'<br>'+esc($('addr').value):''}`;
 ['eName','ePhone','eDate'].forEach(i=>$(i).textContent='');$('modal').classList.add('on');}
function closeOrder(){$('modal').classList.remove('on');}
function load(){try{return JSON.parse(localStorage.getItem('egm_calc_orders'))||[]}catch(e){return[]}}
function save(a){localStorage.setItem('egm_calc_orders',JSON.stringify(a));}
function sendOrder(){let ok=true;
 const name=$('fName').value.trim(),ph=$('fPhone').value,dt=$('fDate').value;
 $('eName').textContent=name.length<2?(ok=false,'Укажите имя'):'';
 $('ePhone').textContent=ph.replace(/\D/g,'').length<11?(ok=false,'Введите телефон полностью'):'';
 $('eDate').textContent=(!dt||dt<$('fDate').min)?(ok=false,'Выберите дату не раньше сегодняшней'):'';
 if(!ok)return;
 const a=load();const n=(a.reduce((m,o)=>Math.max(m,o.id),1000))+1;
 a.unshift({id:n,ts:Date.now(),name,phone:ph,mat:R.m.n+' '+R.fr,tons:+R.tons.toFixed(1),trips:R.trips,zone:R.z.n,addr:$('addr').value.trim()||'не указан',date:dt,time:$('fTime').value,com:$('fCom').value.trim(),sum:Math.round(R.tot),st:'new'});
 save(a);closeOrder();$('fName').value='';$('fPhone').value='';$('fCom').value='';
 renderOrders();toast('Заявка №'+n+' отправлена. Менеджер перезвонит в течение 10 минут.');}

/* менеджер */
const ST={new:'Новая',work:'В работе',done:'Выполнена',cancel:'Отменена'};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function dt(ts){return new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function dshort(s){const [y,m,d]=s.split('-');return d+'.'+m+'.'+y}
function actions(o){let b='';
 if(o.st==='new')b+=`<button class="btn sm" onclick="setSt(${o.id},'work')">Взять в работу</button> `;
 if(o.st==='work')b+=`<button class="btn sm" onclick="setSt(${o.id},'done')">Выполнена</button> `;
 if(o.st==='new'||o.st==='work')b+=`<button class="btn ghost sm" onclick="setSt(${o.id},'cancel')">Отменить</button> `;
 if(o.st==='done'||o.st==='cancel')b+=`<button class="btn ghost sm" onclick="setSt(${o.id},'new')">Вернуть</button> `;
 return b+`<button class="btn ghost sm" onclick="delOrder(${o.id})" title="Удалить">✕</button>`;}
function renderOrders(){
 const all=load(),f=$('fSt').value,q=$('fQ').value.toLowerCase();
 const a=all.filter(o=>(!f||o.st===f)&&(!q||(o.name+o.phone+o.addr+o.mat).toLowerCase().includes(q)));
 $('tb').innerHTML=a.map(o=>`<tr><td><b>№${o.id}</b><br><small>${dt(o.ts)}</small></td><td>${esc(o.name)}<br><small>${esc(o.phone)}</small></td>
  <td>${esc(o.mat)}<br><small>${o.tons} т · ${o.trips} маш.</small></td><td>${esc(o.addr)}<br><small>${esc(o.zone)}<br>${dshort(o.date)}, ${esc(o.time)}</small>${o.com?'<br><small><i>'+esc(o.com)+'</i></small>':''}</td>
  <td><b>${fmt(o.sum)}</b></td><td><span class="st ${o.st}">${ST[o.st]}</span></td><td style="white-space:nowrap">${actions(o)}</td></tr>`).join('');
 $('cards').innerHTML=a.map(o=>`<div class="oc"><div class="h"><b>№${o.id} · ${dt(o.ts)}</b><span class="st ${o.st}">${ST[o.st]}</span></div>
  <p><b>${esc(o.name)}</b>, ${esc(o.phone)}</p><p>${esc(o.mat)} — ${o.tons} т, ${o.trips} маш.</p><p>${esc(o.addr)}</p><p><small>${dshort(o.date)}, ${esc(o.time)}</small></p>
  ${o.com?'<p><i>'+esc(o.com)+'</i></p>':''}<p><b>${fmt(o.sum)}</b></p><div class="act">${actions(o)}</div></div>`).join('');
 $('empty').classList.toggle('hide',a.length>0);
 const nw=all.filter(o=>o.st==='new').length;
 $('cntNew').textContent=nw;$('sAll').textContent=all.length;$('sNew').textContent=nw;
 $('sT').textContent=all.filter(o=>o.st!=='cancel').reduce((s,o)=>s+o.tons,0).toFixed(0);
 $('sSum').textContent=all.filter(o=>o.st!=='cancel').reduce((s,o)=>s+o.sum,0).toLocaleString('ru-RU');
}
function setSt(id,s){const a=load();a.find(o=>o.id===id).st=s;save(a);renderOrders();}
function delOrder(id){if(!confirm('Удалить заявку №'+id+'?'))return;save(load().filter(o=>o.id!==id));renderOrders();}
function seed(){const n=Date.now(),h=3600e3,t=new Date(),d=k=>{const x=new Date();x.setDate(x.getDate()+k);return x.toISOString().slice(0,10)};
 save([
 {id:1004,ts:n-1*h,name:'Сергей Ковалёв',phone:'+7 (916) 214-55-08',mat:'Щебень гранитный 20-40',tons:60,trips:3,zone:'До 30 км от МКАД',addr:'Балашиха, ул. Советская, 10',date:d(1),time:'07:00–09:00',com:'Въезд со стороны шлагбаума',sum:Math.round(60*2450+3*9500),st:'new'},
 {id:1003,ts:n-5*h,name:'ООО «СтройРесурс»',phone:'+7 (495) 730-12-44',mat:'Песок мытый обычный',tons:40,trips:2,zone:'Москва, в пределах МКАД',addr:'Москва, ул. Верхние Поля, 22',date:d(0),time:'12:00–15:00',com:'',sum:40*950+2*6500,st:'work'},
 {id:1002,ts:n-26*h,name:'Андрей Мельников',phone:'+7 (903) 118-76-31',mat:'ПГС природная',tons:100,trips:5,zone:'30–60 км от МКАД',addr:'Подольск, СНТ Дубрава, уч. 41',date:d(1),time:'09:00–12:00',com:'Узкая дорога, нужны короткие машины',sum:100*800+5*13500,st:'new'},
 {id:1001,ts:n-50*h,name:'ИП Захаров В. П.',phone:'+7 (926) 505-90-17',mat:'Щебень гравийный 5-20',tons:20,trips:1,zone:'До 30 км от МКАД',addr:'Мытищи, Ярославское ш., 118',date:d(-1),time:'В течение дня',com:'',sum:20*2200+9500,st:'done'}
 ]);}
function resetDemo(){if(confirm('Заменить все заявки демо-данными?')){localStorage.removeItem('egm_calc_orders');seed();renderOrders();}}
function tab(t){$('viewCalc').classList.toggle('hide',t!=='calc');$('viewOrders').classList.toggle('hide',t!=='orders');
 $('tabCalc').classList.toggle('on',t==='calc');$('tabOrders').classList.toggle('on',t==='orders');}
let tt;function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',3500);}
init();
</script>
